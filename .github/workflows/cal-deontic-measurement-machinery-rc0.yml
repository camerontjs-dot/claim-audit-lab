name: Research - CAL deontic measurement machinery RC0

on:
  push:
    branches:
      - research/cal-deontic-measurement-machinery-rc0-20260917
  pull_request:
    paths:
      - "research/deontic_measurement_machinery_rc0/**"
      - "tests/research/test_deontic_measurement_machinery_*"
      - ".github/workflows/cal-deontic-measurement-machinery-rc0.yml"

permissions:
  contents: read

jobs:
  discriminate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Install exact repository environment
        run: uv sync --all-extras

      - name: Install declared spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Verify Gate-0 parent and production-source isolation
        run: |
          git cat-file -e 7f1e63a17b18c14fe23c3fed00c7faf102bc62e7^{commit}
          git cat-file -e 791cd59fa47ba8e7a709f289584468aa9e255334^{commit}
          git diff --exit-code 7f1e63a17b18c14fe23c3fed00c7faf102bc62e7 -- src/

      - name: Run frozen evaluator controls
        run: uv run python -m pytest -q tests/research/test_deontic_measurement_machinery_apparatus_rc0.py

      - name: Run candidate machinery discrimination
        run: uv run python -m pytest -q tests/research/test_deontic_measurement_machinery_candidate_rc0.py

      - name: Print candidate machinery comparison
        run: uv run python -m research.deontic_measurement_machinery_rc0.report

      - name: Run focused Ruff on newly exposed candidate code
        run: uv run python -m ruff check research/deontic_measurement_machinery_rc0/candidate.py research/deontic_measurement_machinery_rc0/report.py

      - name: Run candidate format check
        run: uv run python -m ruff format --check research/deontic_measurement_machinery_rc0/candidate.py research/deontic_measurement_machinery_rc0/report.py

      - name: Run strict mypy
        run: uv run python -m mypy

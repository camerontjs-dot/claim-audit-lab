name: Research - CAL quantitative change warranted composition RC1

on:
  push:
    branches: [research/cal-quantitative-change-warranted-composition-rc1-20260917]
  pull_request:
    paths:
      - "research/quantitative_change_warranted_composition_rc1/**"
      - "tests/research/test_quantitative_change_warranted_composition_rc1_*"
      - ".github/workflows/cal-quantitative-change-warranted-composition-rc1.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Verify scalar parent isolation
        run: |
          git diff --exit-code c33b656819e91ac38a85c48921b84ea20ec090bc -- src/
          git diff --exit-code c33b656819e91ac38a85c48921b84ea20ec090bc -- research/scalar_gate1b_authority_rc0
      - name: Frozen evaluator controls
        run: uv run python -m pytest -q tests/research/test_quantitative_change_warranted_composition_rc1_apparatus.py
      - name: Candidate qualification
        run: uv run python -m pytest -q tests/research/test_quantitative_change_warranted_composition_rc1_candidate.py
      - name: Report
        run: uv run python -m research.quantitative_change_warranted_composition_rc1.report
      - name: Static checks
        run: uv run python -m ruff check research/quantitative_change_warranted_composition_rc1 tests/research/test_quantitative_change_warranted_composition_rc1_*

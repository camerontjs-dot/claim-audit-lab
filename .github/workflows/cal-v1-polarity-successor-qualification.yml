name: CAL V1 polarity successor qualification

on:
  push:
    branches: [research/cal-v1-polarity-successor-qualification-rc0-20261003]
  pull_request:
    branches: [research/cal-v1-strict-comparison-polarity-rc0-20261002]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: e24e405f5336ee024674f39dba97255bb58a2dd9
          path: external/frozen-cal

      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: 4e1f6fe00e7c350b28f52bfea14f1f8988847884
          path: external/evidence-bundler

      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: c5b1d757f3a0ad4f6e2c3f6dbdc2dd2d3c1403ec
          path: external/contract-c

      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: b42c827acb0a9fe65353354d709add0e27bab307
          path: external/rc2

      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 1d33e0612befcf8016816197c90c062373796df9
          path: external/resolver

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Prepare maintained environment and exact external dependencies
        run: |
          echo 'external/' >> .git/info/exclude
          uv sync --python 3.11 --all-extras --frozen
          uv pip install -e external/evidence-bundler
          uv run --frozen python -m spacy download en_core_web_sm

      - name: Run frozen polarity successor qualification
        run: |
          .venv/bin/python \
            research/cal_v1_polarity_successor_qualification_rc0_20261003/qualify.py \
            --external external \
            --out outputs/polarity-successor

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cal-v1-polarity-successor-${{ github.sha }}
          if-no-files-found: error
          path: |
            outputs/polarity-successor/receipt.json
            outputs/polarity-successor/first-failure.txt
            outputs/polarity-successor/*.log
            outputs/polarity-successor/polarity-replay/decisive-result.json
            outputs/polarity-successor/target-authoring-conformance.json
            outputs/polarity-successor/parent-contract-c.json
            outputs/polarity-successor/dist/*

name: Research - RC7E language instrument ablation

on:
  push:
    branches:
      - research-infra/language-instrument-ablation-rc7e-20260831
  workflow_dispatch:
    inputs:
      phase:
        description: "qualification before held-out, or scientific after cohort freeze"
        required: true
        type: choice
        options:
          - qualification
          - scientific
        default: qualification

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  TOKENIZERS_PARALLELISM: "false"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  rc7e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve bounded phase
        id: phase
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/language_instrument_ablation_rc7e
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            phase='${{ inputs.phase }}'
          elif [[ -f "$ROOT/results/RESULTS.json" ]]; then
            phase='skip'
          elif [[ -f "$ROOT/cohort.py" ]]; then
            phase='scientific'
          else
            phase='qualification'
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "Resolved RC7E phase: $phase"

      - uses: actions/setup-python@v5
        if: ${{ steps.phase.outputs.phase != 'skip' }}
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/language_instrument_ablation_rc7e/requirements.txt

      - uses: actions/setup-java@v5
        if: ${{ steps.phase.outputs.phase != 'skip' }}
        with:
          distribution: temurin
          java-version: "17"

      - name: Install frozen Python research dependencies
        if: ${{ steps.phase.outputs.phase != 'skip' }}
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r research/language_instrument_ablation_rc7e/requirements.txt
          python -m pip install 'supar==1.1.4'

      - name: Download frozen Stanza English processors
        if: ${{ steps.phase.outputs.phase != 'skip' }}
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import stanza
          stanza.download('en', processors='tokenize,pos,lemma,depparse,constituency', verbose=False)
          PY

      - name: Download exact CoreNLP 4.5.10 distribution
        if: ${{ steps.phase.outputs.phase != 'skip' }}
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/stanford-corenlp-4.5.10.zip https://nlp.stanford.edu/software/stanford-corenlp-4.5.10.zip
          unzip -q /tmp/stanford-corenlp-4.5.10.zip -d "$RUNNER_TEMP"
          echo "CORENLP_HOME=$RUNNER_TEMP/stanford-corenlp-4.5.10" >> "$GITHUB_ENV"

      - name: Verify production source unchanged from exact RC7D-D base
        if: ${{ steps.phase.outputs.phase != 'skip' }}
        shell: bash
        run: |
          set -euxo pipefail
          git cat-file -e 253af5313e93932875bdd5956ac46246f3796271^{commit}
          git diff --exit-code 253af5313e93932875bdd5956ac46246f3796271 -- src/

      - name: Run pre-held-out qualification
        if: ${{ steps.phase.outputs.phase == 'qualification' }}
        run: python -m research.language_instrument_ablation_rc7e.qualification_v2

      - name: Guard scientific phase requires frozen cohort
        if: ${{ steps.phase.outputs.phase == 'scientific' }}
        shell: bash
        run: |
          set -euxo pipefail
          test -f research/language_instrument_ablation_rc7e/cohort.py
          python - <<'PY'
          from research.language_instrument_ablation_rc7e.cohort import CASES, COHORT_FREEZE_EXPECTED
          assert CASES, 'empty cohort'
          assert COHORT_FREEZE_EXPECTED, 'missing cohort identity sentinel'
          print({'cases': len(CASES), 'cohort_freeze_expected': COHORT_FREEZE_EXPECTED})
          PY

      - name: Run scientific ablation
        if: ${{ steps.phase.outputs.phase == 'scientific' }}
        run: python -m research.language_instrument_ablation_rc7e.run_ablation_v2

      - name: Write environment receipt
        if: ${{ always() && steps.phase.outputs.phase != 'skip' }}
        shell: bash
        run: |
          mkdir -p research/language_instrument_ablation_rc7e/results
          python -VV > research/language_instrument_ablation_rc7e/results/PYTHON.txt || true
          java -version 2> research/language_instrument_ablation_rc7e/results/JAVA.txt || true
          python -m pip freeze | sort > research/language_instrument_ablation_rc7e/results/PIP_FREEZE.txt || true
          git rev-parse HEAD > research/language_instrument_ablation_rc7e/results/RUN_HEAD.txt
          git status --short > research/language_instrument_ablation_rc7e/results/GIT_STATUS.txt
          printf '%s\n' '${{ steps.phase.outputs.phase }}' > research/language_instrument_ablation_rc7e/results/PHASE.txt
          free -h > research/language_instrument_ablation_rc7e/results/HOST_MEMORY.txt || true
          df -h > research/language_instrument_ablation_rc7e/results/HOST_DISK.txt || true
          du -sb "$HOME/.cache" > research/language_instrument_ablation_rc7e/results/CACHE_BYTES.txt 2>&1 || true
          du -sb "$CORENLP_HOME" > research/language_instrument_ablation_rc7e/results/CORENLP_BYTES.txt 2>&1 || true

      - name: Hash evidence payload
        if: ${{ always() && steps.phase.outputs.phase != 'skip' }}
        shell: bash
        run: |
          set -euxo pipefail
          cd research/language_instrument_ablation_rc7e/results
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt || true

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.phase.outputs.phase != 'skip' }}
        with:
          name: rc7e-${{ steps.phase.outputs.phase }}-${{ github.run_id }}
          path: research/language_instrument_ablation_rc7e/results/
          if-no-files-found: warn
          retention-days: 90

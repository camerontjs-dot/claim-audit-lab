name: CAL Temporal Contract C Decision Conformance RC0

on:
  workflow_dispatch:
  push:
    branches:
      - research/cal-temporal-contract-c-decision-rc0-20260909
    paths:
      - research/cal_temporal_contract_c_decision_rc0/DECISION-PREREGISTRATION.md
      - research/cal_temporal_contract_c_decision_rc0/evaluate_decision_conformance.py
      - .github/workflows/cal-temporal-decision-conformance-rc0.yml

permissions:
  contents: read

jobs:
  temporal-decision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CAL research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frozen RC7F-C
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: e8d33913db66ad21027dffdf731d50f7a0977c8f
          path: _deps/event

      - name: Checkout frozen RC8J
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 8e75c6782bb95c3763d06230b9c5df2b6af44054
          path: _deps/rc8j

      - name: Checkout Contract C 1.0 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1
          path: _deps/contract-c
          fetch-depth: 0

      - name: Checkout Contract D 1.0 authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
          path: _deps/contract-d
          fetch-depth: 0

      - name: Checkout exact maintained Decision Engine
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/decision-engine
          ref: 358c2bb20f490bf25e808434394b26a70a16a123
          path: _deps/decision
          fetch-depth: 0

      - name: Install exact Contract C authority dependencies
        run: python -m pip install --disable-pip-version-check -e _deps/contract-c

      - name: Verify research boundary and exact consumers
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 1fe223979a866ec10428ff696bb373739728d461...HEAD)"
          if printf '%s\n' "$changed" | grep -q '^src/'; then
            echo 'production CAL src mutation detected' >&2
            exit 1
          fi
          git merge-base --is-ancestor 10ce0894a56f265434b24963bf0543765c453996 HEAD
          test "$(git hash-object research/cal_temporal_contract_c_decision_rc0/bound_relation.py)" = "94b44f3b0b2b3f077c17ca55eb944117ffa22b77"
          test "$(git hash-object research/cal_temporal_contract_c_decision_rc0/bound_projection.py)" = "77fed3e7a7273b13e6dfb89e0ffee7fce1503c6c"
          test "$(git -C _deps/decision rev-parse HEAD)" = "358c2bb20f490bf25e808434394b26a70a16a123"
          test "$(git -C _deps/decision hash-object scripts/decision-engine-evaluate.mjs)" = "b3808a536ca5f976ca1022c7c9f13a229d31af79"
          test "$(git -C _deps/decision hash-object src/contractCIngress.js)" = "f57a8067dadc04afb459f1d0342b2b786ec775e6"
          test "$(git -C _deps/decision hash-object src/contractCDecision.js)" = "3529b75f75936fffb9b2d9e2972cb7117b526661"
          test "$(git -C _deps/decision hash-object src/contractCDecisionRuntime.js)" = "7020006a350f78b0381df3309f8085966890a049"
          test "$(git -C _deps/decision hash-object src/contractDCanonicalOutput.js)" = "0ea61767b9ae61b3b80c0c2f26de4292f213b7fb"
          test "$(git -C _deps/contract-c rev-parse HEAD)" = "5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1"
          test "$(git -C _deps/contract-d rev-parse HEAD)" = "298a1a0f7b7b6d7712e11200d04faec3e1ca169b"

      - name: Compile evaluator
        run: python -m compileall -q research/cal_temporal_contract_c_decision_rc0

      - name: Execute temporal Decision conformance
        run: |
          python -m research.cal_temporal_contract_c_decision_rc0.evaluate_decision_conformance \
            --repo-root . \
            --event-root _deps/event \
            --rc8j-root _deps/rc8j \
            --contract-c-root _deps/contract-c \
            --contract-d-root _deps/contract-d \
            --decision-root _deps/decision \
            --cohort research/cal_temporal_contract_c_decision_rc0/BOUND-COHORT.json \
            --out build/cal-temporal-decision-conformance-rc0

      - name: Verify terminal scientific receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('build/cal-temporal-decision-conformance-rc0/DECISION-EVALUATION.json').read_text())
          assert data['research_disposition'] in {
              'SUPPORTED_WITH_BOUNDS_AND_UPSTREAM_PROVENANCE_GAP',
              'FALSIFIED_TEMPORAL_DECISION_CONFORMANCE',
          }
          assert data['decision_engine_head']=='358c2bb20f490bf25e808434394b26a70a16a123'
          assert data['interpretation']['contract_c_unresolved_evidence_provenance_lossless'] is False
          assert data['interpretation']['contract_d_clear_is_authorization'] is False
          assert data['interpretation']['contract_e_authorization_evaluated'] is False
          assert data['interpretation']['external_mutation_performed'] is False
          assert data['interpretation']['production_promotion_authorized'] is False
          print(json.dumps({'research_disposition': data['research_disposition'], **data['summary']}, sort_keys=True))
          PY

      - name: Package conformance evidence
        if: always()
        shell: bash
        run: |
          mkdir -p build/cal-temporal-decision-conformance-rc0
          cp research/cal_temporal_contract_c_decision_rc0/DECISION-PREREGISTRATION.md build/cal-temporal-decision-conformance-rc0/
          cp research/cal_temporal_contract_c_decision_rc0/BOUND-RESULTS.md build/cal-temporal-decision-conformance-rc0/
          tar -czf cal-temporal-decision-conformance-rc0-${GITHUB_RUN_ID}.tar.gz -C build cal-temporal-decision-conformance-rc0

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal-temporal-decision-conformance-rc0-${{ github.run_id }}
          path: cal-temporal-decision-conformance-rc0-${{ github.run_id }}.tar.gz
          if-no-files-found: error

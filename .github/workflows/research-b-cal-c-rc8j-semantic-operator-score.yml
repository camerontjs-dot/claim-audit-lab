name: Research RC8J semantic-operator score falsifier

on:
  push:
    branches:
      - research-infra/rc8j-semantic-operator-score-falsifier-20260902
  pull_request:
    paths:
      - "research/b_cal_c_shadow_candidate/RC8J_SEMANTIC_OPERATOR_SCORE_PREREGISTRATION.md"
      - "research/b_cal_c_shadow_candidate/run_rc8j_semantic_operator_score_falsifier.py"
      - ".github/workflows/research-b-cal-c-rc8j-semantic-operator-score.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score-falsifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout score successor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout frozen Contract B authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: c314e53bd91c0736aa4370a364673b069aceb43e
          path: _deps/apparatus-b

      - name: Checkout frozen Contract C authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1
          path: _deps/apparatus-c

      - name: Checkout Evidence Bundler production pin
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: c8189c31adbab11729c31430c2070126224a2d42
          path: _deps/evidence-bundler

      - name: Checkout RC7F-B1 comparison instrument
        uses: actions/checkout@v4
        with:
          ref: 0ecdedc5cea970485a635508255f3670ab231c33
          path: _deps/rc7fb1

      - name: Checkout RC7F-C event-ordering instrument
        uses: actions/checkout@v4
        with:
          ref: e8d33913db66ad21027dffdf731d50f7a0977c8f
          path: _deps/rc7fc

      - name: Checkout RC7F-D permission-composition instrument
        uses: actions/checkout@v4
        with:
          ref: 9e1f28c3e4f217561e4364e1560539bdf4870298
          path: _deps/rc7fd

      - name: Checkout frozen RC8J authority candidate
        uses: actions/checkout@v4
        with:
          ref: 8e75c6782bb95c3763d06230b9c5df2b6af44054
          path: _deps/rc8j

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Install CAL and Evidence Bundler
        run: |
          set -euo pipefail
          uv sync --all-extras
          uv pip install --editable _deps/evidence-bundler

      - name: Verify frozen decision and authority surfaces
        run: |
          set -euo pipefail
          test "$(git hash-object src/claim_audit_lab/v1/decision_model.py)" = 'f0d9d3bc061d966ed9c8c16b3424b3dd5c3bb339'
          test "$(git -C _deps/rc8j rev-parse HEAD)" = '8e75c6782bb95c3763d06230b9c5df2b6af44054'
          test "$(git -C _deps/rc8j hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8j.py)" = 'f55156e43e0c1b4a7868bc8339585b8892edda38'

      - name: Re-run frozen valid-B parent corpus
        run: |
          set -euo pipefail
          mkdir -p research/b_cal_c_shadow_candidate/run-output
          candidate_sha="$(git rev-parse HEAD)"
          uv run python research/b_cal_c_shadow_candidate/run_integration_v5.py \
            --deps _deps \
            --out research/b_cal_c_shadow_candidate/run-output \
            --candidate-sha "$candidate_sha" \
            2>&1 | tee research/b_cal_c_shadow_candidate/run-output/stdout.txt

      - name: Execute warranted semantic-operator score falsifier
        run: |
          set -euo pipefail
          uv run python research/b_cal_c_shadow_candidate/run_rc8j_semantic_operator_score_falsifier.py \
            --run-output research/b_cal_c_shadow_candidate/run-output \
            --rc8j-root _deps/rc8j \
            2>&1 | tee research/b_cal_c_shadow_candidate/run-output/rc8j-semantic-operator-score-stdout.txt

      - name: Enforce falsifier disposition
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p = 'research/b_cal_c_shadow_candidate/run-output/RC8J-SEMANTIC-OPERATOR-SCORE-FALSIFIER.json'
          r = json.load(open(p))
          assert r['rc8j_positive']['status'] == 'WARRANTED'
          assert r['rc8j_positive']['supplies_channel'] is False
          assert r['rc8j_positive']['supplies_scalar_decision_score'] is False
          assert r['support_scalar_series_non_score_surface_identical'] is True
          cases = {row['case_id']: row for row in r['cases']}
          assert cases['F1-NO-SCORE']['decision']['disposition'] == 'abstained'
          assert cases['F1-NO-SCORE']['decision']['reason_code'] == 'contribution_score_unmeasured'
          assert cases['F2-SCORE-0.69']['decision']['reason_code'] == 'support_below_decision_threshold'
          assert cases['F3-SCORE-0.70']['decision']['verdict'] == 'supported'
          assert cases['F4-SCORE-0.95']['decision']['verdict'] == 'supported'
          assert cases['F5-REFUTATION-CHANNEL-SCORE-0.70']['decision']['verdict'] == 'contradicted'
          assert cases['F6-MIXED-HIGH-SCORES']['valid_state'] == 'mixed'
          assert cases['F6-MIXED-HIGH-SCORES']['decision']['reason_code'] == 'mixed_valid_evidence'
          assert r['unresolved_authority_control']['valid_semantic_operator_construction_refused'] is True
          assert r['observed_scalar_decision_flip']['only_scalar_value_changed_between_boundary_cases'] is True
          assert r['observed_channel_decision_flip']['rc8j_warrant_unchanged'] is True
          assert r['shortcut_supported'] is False
          PY

      - name: Verify no production source changes
        run: |
          set -euo pipefail
          if git diff --name-only 53f0885b111676794d1bd20e10b91aa58b07e9d4...HEAD -- src/ | grep -q .; then
            echo "Production src/ changed in semantic-operator score falsifier" >&2
            exit 1
          fi

      - name: Upload score-falsifier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc8j-semantic-operator-score-${{ github.run_id }}
          path: research/b_cal_c_shadow_candidate/run-output
          if-no-files-found: error
          retention-days: 90

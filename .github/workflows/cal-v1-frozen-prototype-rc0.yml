name: CAL V1 Frozen Prototype RC0

on:
  push:
    branches:
      - prototype/cal-v1-frozen-app-rc0-20260914

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify qualified semantic core is unchanged
        shell: bash
        run: |
          set -euo pipefail
          BASE=a902621e8baea3063dddd7f92ba975aade305464
          test "$(git rev-parse "$BASE:src/claim_audit_lab/cal_v1_candidate/engine.py")" = "$(git rev-parse HEAD:src/claim_audit_lab/cal_v1_candidate/engine.py)"
          test "$(git rev-parse "$BASE:src/claim_audit_lab/cal_v1_candidate/relations.py")" = "$(git rev-parse HEAD:src/claim_audit_lab/cal_v1_candidate/relations.py)"
          test "$(git rev-parse "$BASE:src/claim_audit_lab/cal_v1_candidate/measurements.py")" = "$(git rev-parse HEAD:src/claim_audit_lab/cal_v1_candidate/measurements.py)"
          test "$(git rev-parse "$BASE:src/claim_audit_lab/cal_v1_candidate/authority.py")" = "$(git rev-parse HEAD:src/claim_audit_lab/cal_v1_candidate/authority.py)"
          test "$(git rev-parse "$BASE:src/claim_audit_lab/cal_v1_candidate/authority_validation.py")" = "$(git rev-parse HEAD:src/claim_audit_lab/cal_v1_candidate/authority_validation.py)"
          test "$(git rev-parse "$BASE:src/claim_audit_lab/cal_v1_candidate/models.py")" = "$(git rev-parse HEAD:src/claim_audit_lab/cal_v1_candidate/models.py)"
          changed="$(git diff --name-only "$BASE"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(src/claim_audit_lab/cal_v1_candidate/prototype\.py|tests/test_cal_v1_frozen_prototype\.py|prototype/cal_v1_frozen_app_rc0/.*|\.github/workflows/cal-v1-frozen-prototype-rc0\.yml)$' | grep -q .; then
            echo 'prototype escaped bounded research surface' >&2
            exit 1
          fi

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Mirror canonical CAL dependency environment
        run: uv sync --all-extras

      - name: Install canonical spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Run frozen candidate regression and prototype tests
        run: |
          uv run python -m pytest -q tests/test_cal_v1_candidate.py tests/test_cal_v1_authority_integrity_rc1.py tests/test_cal_v1_frozen_prototype.py

      - name: Run canonical public suite
        run: uv run python -m pytest -q

      - name: Canonical static quality
        run: |
          uv run python -m ruff check src tests
          uv run python -m ruff format --check src
          uv run python -m mypy

      - name: Execute fixture twice and require deterministic output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/cal-v1-frozen-prototype-rc0/run1 build/cal-v1-frozen-prototype-rc0/run2
          uv run python -m claim_audit_lab.cal_v1_candidate.prototype \
            prototype/cal_v1_frozen_app_rc0/fixture-strict-support.json \
            --json-out build/cal-v1-frozen-prototype-rc0/run1/result.json \
            --report-out build/cal-v1-frozen-prototype-rc0/run1/report.md
          uv run python -m claim_audit_lab.cal_v1_candidate.prototype \
            prototype/cal_v1_frozen_app_rc0/fixture-strict-support.json \
            --json-out build/cal-v1-frozen-prototype-rc0/run2/result.json \
            --report-out build/cal-v1-frozen-prototype-rc0/run2/report.md
          cmp build/cal-v1-frozen-prototype-rc0/run1/result.json build/cal-v1-frozen-prototype-rc0/run2/result.json
          cmp build/cal-v1-frozen-prototype-rc0/run1/report.md build/cal-v1-frozen-prototype-rc0/run2/report.md
          uv run python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('build/cal-v1-frozen-prototype-rc0/run1/result.json').read_text())
          assert result['schema'] == 'cal-v1-frozen-prototype-result-v1'
          assert result['prototype_profile'] == 'cal-v1-frozen-prototype-rc0'
          assert result['semantic_implementation_sha'] == 'a902621e8baea3063dddd7f92ba975aade305464'
          assert result['result']['conclusion'] == 'supported'
          assert result['contract_c_handoff']['state'] == 'not_emitted'
          assert result['authorization']['automatic_action_allowed'] is False
          PY

      - name: Build wheel and execute prototype from clean install
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m build
          python -m venv build/prototype-wheel-venv
          build/prototype-wheel-venv/bin/python -m pip install dist/*.whl
          build/prototype-wheel-venv/bin/python -m claim_audit_lab.cal_v1_candidate.prototype \
            prototype/cal_v1_frozen_app_rc0/fixture-strict-support.json \
            --json-out build/cal-v1-frozen-prototype-rc0/wheel-result.json \
            --report-out build/cal-v1-frozen-prototype-rc0/wheel-report.md
          cmp build/cal-v1-frozen-prototype-rc0/run1/result.json build/cal-v1-frozen-prototype-rc0/wheel-result.json

      - name: Record exact identities
        shell: bash
        run: |
          set -euo pipefail
          out=build/cal-v1-frozen-prototype-rc0
          git rev-parse HEAD > "$out/PROTOTYPE_HEAD.txt"
          git rev-parse a902621e8baea3063dddd7f92ba975aade305464 > "$out/SEMANTIC_BASE.txt"
          git rev-parse HEAD:src/claim_audit_lab/cal_v1_candidate/prototype.py > "$out/PROTOTYPE_RUNNER_BLOB.txt"
          git rev-parse HEAD:tests/test_cal_v1_frozen_prototype.py > "$out/PROTOTYPE_TEST_BLOB.txt"
          git rev-parse HEAD:.github/workflows/cal-v1-frozen-prototype-rc0.yml > "$out/WORKFLOW_BLOB.txt"
          sha256sum prototype/cal_v1_frozen_app_rc0/fixture-strict-support.json > "$out/FIXTURE_SHA256.txt"
          sha256sum "$out/run1/result.json" > "$out/RESULT_SHA256.txt"

      - name: Upload frozen prototype evidence
        uses: actions/upload-artifact@v4
        with:
          name: cal-v1-frozen-prototype-rc0-${{ github.run_id }}
          path: build/cal-v1-frozen-prototype-rc0/
          if-no-files-found: error

name: Research - CAL event order authority pressure RC0

on:
  push:
    branches: [research/cal-event-order-authority-pressure-rc0-20260917]
  pull_request:
    paths:
      - "research/cal_event_order_authority_pressure_rc0/**"
      - ".github/workflows/cal-event-order-authority-pressure-rc0.yml"

permissions:
  contents: read

jobs:
  pressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras

      - name: Checkout frozen RC7F-C
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: e8d33913db66ad21027dffdf731d50f7a0977c8f
          path: _deps/event

      - name: Checkout frozen RC8J
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 8e75c6782bb95c3763d06230b9c5df2b6af44054
          path: _deps/rc8j

      - name: Verify frozen PR96 subject and source isolation
        run: |
          test "$(git hash-object research/cal_event_order_authority_rc0/candidate.py)" = "36a8d1fbd9e52ec743757f750f744ad4553b5698"
          test "$(git hash-object research/cal_event_order_authority_rc0/event_authority.py)" = "88df954235069e98582e731f48e46e5b257da93f"
          git diff --exit-code 3a4b5f24f813843eae3857ed3444fb12b1cb8182 -- research/cal_event_order_authority_rc0
          git diff --exit-code 3a4b5f24f813843eae3857ed3444fb12b1cb8182 -- src/

      - name: Execute pressure
        run: |
          uv run python -m research.cal_event_order_authority_pressure_rc0.pressure \
            --repo-root . \
            --event-root _deps/event \
            --rc8j-root _deps/rc8j \
            --out build/cal-event-order-authority-pressure/EVALUATION.json

      - name: Apply hard pressure gate
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("build/cal-event-order-authority-pressure/EVALUATION.json").read_text())
          assert data["positive_failures"] == []
          assert data["semantic_completion_leaks"] == []
          assert data["unsafe_warranted_leaks"] == []
          assert data["research_disposition"] == "SUPPORTED_EVENT_ORDER_AUTHORITY_PRESSURE_RC0"
          PY

      - name: Static checks on pressure harness
        run: |
          uv run python -m ruff check research/cal_event_order_authority_pressure_rc0
          uv run python -m ruff format --check research/cal_event_order_authority_pressure_rc0

name: CAL Event-Order Cross-Bundle Composition Falsifier

on:
  workflow_dispatch:
  push:
    branches:
      - research/cal-temporal-contract-c-decision-rc0-20260909
    paths:
      - research/cal_temporal_contract_c_decision_rc0/cross_bundle_composition_falsifier.py
      - .github/workflows/cal-event-order-cross-bundle-composition-falsifier.yml

permissions:
  contents: read

jobs:
  cross-bundle-composition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout frozen RC7F-C
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: e8d33913db66ad21027dffdf731d50f7a0977c8f
          path: _deps/event
      - name: Checkout frozen RC8J
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 8e75c6782bb95c3763d06230b9c5df2b6af44054
          path: _deps/rc8j
      - name: Verify Phase-3 frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/cal_event_order_relation_rc0/relation.py)" = "70f9eff65330c4182b5ac3bd1a11d13059326ed6"
          test "$(git hash-object research/cal_event_order_relation_rc0/candidate.py)" = "7e964d85eb80298b9b0d5b84eff32e14bed4b013"
      - name: Run post-evidence composition falsifier
        run: |
          python -m research.cal_temporal_contract_c_decision_rc0.cross_bundle_composition_falsifier \
            --repo-root . \
            --event-root _deps/event \
            --rc8j-root _deps/rc8j \
            --out build/cal-event-order-cross-bundle-composition
      - name: Verify scientific receipt exists
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('build/cal-event-order-cross-bundle-composition/CROSS-BUNDLE-COMPOSITION.json').read_text())
          assert data['research_disposition'] in {
              'FALSIFIED_COMMON_EVIDENCE_WORLD_BINDING',
              'CROSS_BUNDLE_COMPOSITION_REFUSED',
          }
          assert data['interpretation']['single_relation_semantics_falsified'] is False
          assert data['interpretation']['production_promotion_authorized'] is False
          print(json.dumps({
              'research_disposition': data['research_disposition'],
              'cross_bundle_composition_accepted': data['cross_bundle_composition_accepted'],
              'bundle_a': data['bundle_a']['id'],
              'bundle_b': data['bundle_b']['id'],
          }, sort_keys=True))
          PY
      - name: Package evidence
        if: always()
        shell: bash
        run: tar -czf cal-event-order-cross-bundle-composition-${GITHUB_RUN_ID}.tar.gz -C build cal-event-order-cross-bundle-composition
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal-event-order-cross-bundle-composition-${{ github.run_id }}
          path: cal-event-order-cross-bundle-composition-${{ github.run_id }}.tar.gz
          if-no-files-found: error

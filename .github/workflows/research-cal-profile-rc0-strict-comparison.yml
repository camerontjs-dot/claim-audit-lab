name: Research CAL Profile RC0 strict comparison

on:
  push:
    branches:
      - research-infra/cal-research-profile-rc0-strict-comparison-20260906
  pull_request:
    paths:
      - "research/cal_research_profile_rc0/**"
      - ".github/workflows/research-cal-profile-rc0-strict-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc0-strict-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/camerontjs-dot/claim-audit-lab.git _deps/rc7fb1
          git -C _deps/rc7fb1 checkout 0ecdedc5cea970485a635508255f3670ab231c33
          git clone --no-checkout https://github.com/camerontjs-dot/claim-audit-lab.git _deps/rc8j
          git -C _deps/rc8j checkout 8e75c6782bb95c3763d06230b9c5df2b6af44054
          git clone --no-checkout https://github.com/camerontjs-dot/apparatus-contracts.git _deps/apparatus-b
          git -C _deps/apparatus-b checkout c314e53bd91c0736aa4370a364673b069aceb43e
          git clone --no-checkout https://github.com/camerontjs-dot/apparatus-contracts.git _deps/apparatus-c
          git -C _deps/apparatus-c checkout 5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Install bounded test dependencies
        run: uv sync

      - name: Verify exact dependency identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _deps/rc7fb1 rev-parse HEAD)" = 0ecdedc5cea970485a635508255f3670ab231c33
          test "$(git -C _deps/rc7fb1 hash-object research/comparative_relation_measurement_rc7fb1/comparator.py)" = 33820f55e2a87c4de6336fca6b5e5b93a2bccde3
          test "$(git -C _deps/rc8j rev-parse HEAD)" = 8e75c6782bb95c3763d06230b9c5df2b6af44054
          test "$(git -C _deps/rc8j hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8j.py)" = f55156e43e0c1b4a7868bc8339585b8892edda38
          test "$(git -C _deps/apparatus-b rev-parse HEAD)" = c314e53bd91c0736aa4370a364673b069aceb43e
          test "$(git -C _deps/apparatus-c rev-parse HEAD)" = 5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1
          test "$(git -C _deps/apparatus-c hash-object validators/contract_c.py)" = 9c75ccfbf2223578a8d1a7bf0c39673b394fbea4

      - name: Run frozen seam/falsifier suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/cal_research_profile_rc0/run-output
          uv run python research/cal_research_profile_rc0/seam_suite.py \
            --rc7fb1-root _deps/rc7fb1 \
            --rc8j-root _deps/rc8j \
            --out research/cal_research_profile_rc0/run-output/SEAM-RESULTS.json

      - name: Run post-profile-freeze smoke when present
        shell: bash
        run: |
          set -euo pipefail
          if test -f research/cal_research_profile_rc0/smoke_runner.py; then
            impl_sha="$(python -c 'import json; print(json.load(open("research/cal_research_profile_rc0/PROFILE-MANIFEST.json"))["rc0_research_sha"])')"
            uv run python research/cal_research_profile_rc0/smoke_runner.py \
              --rc7fb1-root _deps/rc7fb1 \
              --rc8j-root _deps/rc8j \
              --apparatus-b _deps/apparatus-b \
              --apparatus-c _deps/apparatus-c \
              --implementation-sha "$impl_sha" \
              --out research/cal_research_profile_rc0/run-output/SMOKE-RESULTS.json
          fi

      - name: Confirm production source is untouched
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only 32275a239b68af383a56bca843e28cbc1e343976...HEAD -- src/ | grep -q .; then
            echo "research RC0 modified production src/" >&2
            exit 1
          fi

      - name: Upload research receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal-research-profile-rc0-${{ github.run_id }}
          path: research/cal_research_profile_rc0/run-output
          if-no-files-found: warn
          retention-days: 90

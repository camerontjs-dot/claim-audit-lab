name: Research - CAL V1 claim compiler RC0

on:
  push:
    branches:
      - research/cal-v1-claim-compiler-rc0-20260917
  pull_request:
    paths:
      - "src/claim_audit_lab/production_v1/claim_compiler.py"
      - "tests/production/test_claim_compiler_rc0.py"
      - "tests/production/fixtures/claim_compiler_rc0.json"
      - "docs/research/CAL_V1_CLAIM_COMPILER_RC0.md"
      - ".github/workflows/cal-v1-claim-compiler-rc0.yml"

permissions:
  contents: read

concurrency:
  group: cal-v1-claim-compiler-rc0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Install exact repository environment
        run: uv sync --all-extras

      - name: Install declared spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Verify frozen parent and corpus history are available
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 929be5baf400ec71f9209e59fbbfa87893a6dcff^{commit}
          git cat-file -e 0070d7b4a99956fce9462d2b3aac15bd7a32f49e^{commit}
          git cat-file -e 8c4f673651f6bf19ed0fdd883e5c08def72b1ae6^{commit}

      - name: Run frozen compiler corpus and boundary falsifiers
        run: uv run python -m pytest -q tests/production/test_claim_compiler_rc0.py

      - name: Run inherited semantic and Contract B gates
        run: >-
          uv run python -m pytest -q
          tests/production/test_semantic_plugin_registry.py
          tests/production/test_semantic_blob_identity.py
          tests/production/test_rc1_semantic_behavior.py
          tests/production/test_rc1_authority_integrity.py
          tests/production/test_convergence_semantics.py
          tests/production/test_contract_b_integration_candidate.py
          tests/production/test_target_identity_binding.py

      - name: Run full repository pytest suite
        run: uv run python -m pytest -q

      - name: Run Ruff lint
        run: uv run python -m ruff check src tests

      - name: Run Ruff format check
        run: uv run python -m ruff format --check src

      - name: Run mypy
        run: uv run python -m mypy

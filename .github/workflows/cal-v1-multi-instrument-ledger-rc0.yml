name: Research - CAL V1 multi-instrument ledger RC0

on:
  push:
    branches:
      - research/cal-v1-multi-instrument-ledger-rc0-20260917
  pull_request:
    paths:
      - "src/claim_audit_lab/production_v1/semantic/measurement_ledger.py"
      - "src/claim_audit_lab/production_v1/semantic/measurements.py"
      - "src/claim_audit_lab/production_v1/semantic/authority.py"
      - "tests/production/test_multi_instrument_ledger_rc0.py"
      - "docs/research/CAL_V1_MULTI_INSTRUMENT_LEDGER_RC0.md"
      - ".github/workflows/cal-v1-multi-instrument-ledger-rc0.yml"

permissions:
  contents: read

concurrency:
  group: cal-v1-multi-instrument-ledger-rc0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Install exact repository environment
        run: uv sync --all-extras

      - name: Install declared spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Verify frozen parent, preregistration, and falsifier history
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e a002ae6ccba7af544de978c0b55bc1a3c37fdb89^{commit}
          git cat-file -e 95ea3a73d2ec26ef36c7fb653b8eb56c4839413c^{commit}
          git cat-file -e bf1be56ae63a1891179018d05c56ab5d661dd3b9^{commit}

      - name: Run frozen multi-instrument ledger and authority falsifiers
        run: uv run python -m pytest -q tests/production/test_multi_instrument_ledger_rc0.py

      - name: Run inherited M1 M2 semantic Contract B and compiler gates
        run: >-
          uv run python -m pytest -q
          tests/production/test_semantic_plugin_registry.py
          tests/production/test_semantic_blob_identity.py
          tests/production/test_rc1_semantic_behavior.py
          tests/production/test_rc1_authority_integrity.py
          tests/production/test_convergence_semantics.py
          tests/production/test_contract_b_integration_candidate.py
          tests/production/test_target_identity_binding.py
          tests/production/test_claim_compiler_rc0.py

      - name: Run full repository pytest suite
        run: uv run python -m pytest -q

      - name: Run Ruff lint
        run: uv run python -m ruff check src tests

      - name: Run Ruff format check
        run: uv run python -m ruff format --check src

      - name: Run mypy
        run: uv run python -m mypy

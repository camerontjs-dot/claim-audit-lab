name: Research - CAL deontic norm contract RC0

on:
  push:
    branches:
      - research/cal-deontic-norm-contract-rc0-20260917
  pull_request:
    paths:
      - "research/deontic_norm_contract_rc0/**"
      - "tests/research/test_deontic_norm_contract_*"
      - ".github/workflows/cal-deontic-norm-contract-rc0.yml"

permissions:
  contents: read

concurrency:
  group: cal-deontic-norm-contract-rc0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Install exact repository environment
        run: uv sync --all-extras

      - name: Install declared spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Verify parent and frozen apparatus history
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 607ec560fd53bd56279193a8d39a48b6f80e1012^{commit}
          git cat-file -e 20640b8f3dd1895c1bfe9b69e99ca549ebb3269c^{commit}
          git diff --exit-code 20640b8f3dd1895c1bfe9b69e99ca549ebb3269c -- \
            research/deontic_norm_contract_rc0/PREREGISTRATION.md \
            research/deontic_norm_contract_rc0/cohort.py \
            research/deontic_norm_contract_rc0/evaluator.py \
            tests/research/test_deontic_norm_contract_apparatus_rc0.py \
            tests/research/test_deontic_norm_contract_candidate_rc0.py

      - name: Guard production source
        run: git diff --exit-code 607ec560fd53bd56279193a8d39a48b6f80e1012 -- src/

      - name: Run frozen apparatus discrimination controls
        run: uv run python -m pytest -q tests/research/test_deontic_norm_contract_apparatus_rc0.py

      - name: Run frozen candidate falsifiers
        run: uv run python -m pytest -q tests/research/test_deontic_norm_contract_candidate_rc0.py

      - name: Run full repository pytest suite
        run: uv run python -m pytest -q

      - name: Run focused Ruff lint
        run: >-
          uv run python -m ruff check
          research/deontic_norm_contract_rc0
          tests/research/test_deontic_norm_contract_apparatus_rc0.py
          tests/research/test_deontic_norm_contract_candidate_rc0.py

      - name: Run focused Ruff format check
        run: >-
          uv run python -m ruff format --check
          research/deontic_norm_contract_rc0
          tests/research/test_deontic_norm_contract_apparatus_rc0.py
          tests/research/test_deontic_norm_contract_candidate_rc0.py

      - name: Run mypy
        run: uv run python -m mypy

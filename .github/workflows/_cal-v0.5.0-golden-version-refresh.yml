name: CAL 0.5.0 one-shot golden version refresh

on:
  push:
    branches:
      - release/v0.5.0

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update only stamped distribution version in frozen trace goldens
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('tests/v1/fixtures/traces')
          old = b'"library_version": "0.4.0"'
          new = b'"library_version": "0.5.0"'
          touched = []
          for path in sorted(root.rglob('*.json')):
              data = path.read_bytes()
              count = data.count(old)
              if count:
                  if count != 1:
                      raise SystemExit(f'{path}: expected one old version stamp, found {count}')
                  if new in data:
                      raise SystemExit(f'{path}: contains both old and new version stamps')
                  path.write_bytes(data.replace(old, new))
                  touched.append(path)

          if len(touched) == 0:
              already = [p for p in sorted(root.rglob('*.json')) if new in p.read_bytes()]
              if len(already) != 30:
                  raise SystemExit(f'expected 30 already-refreshed goldens, found {len(already)}')
              print('Golden version stamps already refreshed; no write needed.')
              raise SystemExit(0)

          if len(touched) != 30:
              raise SystemExit(f'expected exactly 30 golden traces, found {len(touched)}')

          for path in touched:
              data = path.read_bytes()
              if old in data or data.count(new) != 1:
                  raise SystemExit(f'{path}: version-only replacement invariant failed')

          print('Refreshed exactly 30 golden trace version stamps:')
          for path in touched:
              print(path)
          PY

          git diff --check
          python - <<'PY'
          import re
          import subprocess

          diff = subprocess.check_output(
              ['git', 'diff', '--unified=0', '--', 'tests/v1/fixtures/traces'],
              text=True,
          )
          changed_lines = [
              line for line in diff.splitlines()
              if (line.startswith('+') or line.startswith('-'))
              and not line.startswith('+++')
              and not line.startswith('---')
          ]
          old_pat = re.compile(r'^-\s*"library_version": "0\.4\.0",?$')
          new_pat = re.compile(r'^\+\s*"library_version": "0\.5\.0",?$')
          old_lines = [line for line in changed_lines if old_pat.match(line)]
          new_lines = [line for line in changed_lines if new_pat.match(line)]
          unexpected = [
              line for line in changed_lines
              if not old_pat.match(line) and not new_pat.match(line)
          ]
          if len(old_lines) != 30 or len(new_lines) != 30 or unexpected:
              raise SystemExit(
                  f'version-only diff invariant failed: old={len(old_lines)} new={len(new_lines)} unexpected={unexpected[:5]}'
              )
          print('Diff proof: exactly 30 old-version lines replaced by 30 new-version lines; no other golden bytes changed.')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/v1/fixtures/traces
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'release: refresh trace golden version stamps for 0.5.0'
          git push origin HEAD:release/v0.5.0

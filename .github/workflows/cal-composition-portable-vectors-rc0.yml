name: Research - CAL composition portable vectors RC0

on:
  push:
    branches: [research/cal-composition-portable-vectors-rc0-20260918]
  pull_request:
    paths:
      - "research/composition_portable_vectors_rc0/**"
      - "tests/research/test_composition_portable_vectors_rc0.py"
      - ".github/workflows/cal-composition-portable-vectors-rc0.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Verify carrier isolation
        run: |
          git diff --exit-code 865bbeb30ae672c290be98f023b3c4711aba22a4 -- research/composition_provenance_carrier_rc0
          git diff --exit-code 865bbeb30ae672c290be98f023b3c4711aba22a4 -- src/
      - name: Verify frozen producer vectors
        run: uv run python -m pytest -q tests/research/test_composition_portable_vectors_rc0.py
      - name: Static checks
        run: uv run python -m ruff check tests/research/test_composition_portable_vectors_rc0.py

name: Research - CAL strict comparison Gate-1B authority RC2

on:
  push:
    branches: [research/cal-strict-comparison-gate1b-authority-rc2-20260917]
  pull_request:
    paths:
      - "research/strict_comparison_gate1b_authority_rc2/**"
      - "tests/research/test_strict_comparison_gate1b_authority_rc2_*"
      - ".github/workflows/cal-strict-comparison-gate1b-authority-rc2.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Verify predecessor isolation
        run: |
          git diff --exit-code e085fbc0f74480a81e5b3bd4c11796a6543382e7 -- src/
          git diff --exit-code e085fbc0f74480a81e5b3bd4c11796a6543382e7 -- research/strict_comparison_gate1b_authority_rc1
      - name: Frozen regression evaluator control
        run: uv run python -m pytest -q tests/research/test_strict_comparison_gate1b_authority_rc2_apparatus.py
      - name: Candidate regression closure
        run: uv run python -m pytest -q tests/research/test_strict_comparison_gate1b_authority_rc2_candidate.py
      - name: Report
        run: uv run python -m research.strict_comparison_gate1b_authority_rc2.report
      - name: Static checks
        run: uv run python -m ruff check research/strict_comparison_gate1b_authority_rc2 tests/research/test_strict_comparison_gate1b_authority_rc2_*

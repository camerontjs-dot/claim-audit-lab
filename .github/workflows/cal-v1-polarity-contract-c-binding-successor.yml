name: CAL V1 polarity Contract C binding successor qualification

on:
  push:
    branches:
      - research/cal-v1-polarity-contract-c-binding-qualification-rc1-20261003
  pull_request:
    branches:
      - research/cal-v1-polarity-contract-c-authority-binding-rc0-20261003
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen evaluator and unchanged product subject
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:research/cal_v1_polarity_contract_c_binding_successor_rc1_20261003/evaluate.py)" = "f54719e0dadc2a7d7ebb91325a35ebb3687e3da2"
          git diff --exit-code 64b6c7702696c851057c1cf0b2c105b1c81db543 HEAD -- src/claim_audit_lab pyproject.toml uv.lock MANIFEST.in
          diff="$(git diff --name-only 86b60022420a006358fde38b20a204ffe4df1a96 HEAD -- src/claim_audit_lab pyproject.toml uv.lock MANIFEST.in)"
          test "$diff" = "src/claim_audit_lab/production_v1/parent_bound.py"

      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: e24e405f5336ee024674f39dba97255bb58a2dd9
          path: external/frozen-fixture-cal

      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: 4e1f6fe00e7c350b28f52bfea14f1f8988847884
          path: external/evidence-bundler

      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: c183d2d12306ee30c509169a58db55e7430fe8c5
          path: external/contract-c
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: b42c827acb0a9fe65353354d709add0e27bab307
          path: external/rc2
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 292168222f83c67a24190b4846eebe84392e3d04
          path: external/resolver
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: c5b1d757f3a0ad4f6e2c3f6dbdc2dd2d3c1403ec
          path: external/contract-c-old
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 1d33e0612befcf8016816197c90c062373796df9
          path: external/resolver-old
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Prepare environment
        run: |
          echo 'external/' >> .git/info/exclude
          uv sync --python 3.11 --all-extras --frozen
          uv pip install -e external/evidence-bundler
          uv run --frozen python -m spacy download en_core_web_sm
          mkdir -p outputs

      - name: Replay frozen polarity discriminator
        run: |
          .venv/bin/python research/cal_v1_strict_comparison_polarity_rc0_20261002/decisive/evaluate.py \
            --cases research/cal_v1_strict_comparison_polarity_rc0_20261002/decisive/CASES.json \
            --out outputs/polarity
          .venv/bin/python - <<'PY'
          import json
          x=json.load(open("outputs/polarity/decisive-result.json"))
          assert x["matched_count"] == 33 and x["failed_count"] == 0 and x["apparatus_errors"] == [], x
          PY

      - name: Target authoring and conformance regression
        env:
          FROZEN_CAL_ROOT: ${{ github.workspace }}/external/frozen-fixture-cal
          CAL_EB_INTEGRATION_REPO: ${{ github.workspace }}/external/evidence-bundler
          EB_ROOT: ${{ github.workspace }}/external/evidence-bundler
          QUALIFICATION_RESULT: ${{ github.workspace }}/outputs/target.json
        run: .venv/bin/python tests/qualification/cal_v1_target_authoring_conformance_qualification.py

      - name: Execute frozen successor parent qualification
        env:
          FROZEN_FIXTURE_CAL_ROOT: ${{ github.workspace }}/external/frozen-fixture-cal
          EB_ROOT: ${{ github.workspace }}/external/evidence-bundler
          CONTRACT_C_ROOT: ${{ github.workspace }}/external/contract-c
          RC2_ROOT: ${{ github.workspace }}/external/rc2
          RESOLVER_ROOT: ${{ github.workspace }}/external/resolver
          OLD_CONTRACT_C_ROOT: ${{ github.workspace }}/external/contract-c-old
          OLD_RESOLVER_ROOT: ${{ github.workspace }}/external/resolver-old
        run: |
          .venv/bin/python research/cal_v1_polarity_contract_c_binding_successor_rc1_20261003/evaluate.py \
            --out outputs/parent-successor.json

      - name: Full maintained regression
        run: |
          .venv/bin/python -m pytest -q
          .venv/bin/python -m ruff check src tests
          .venv/bin/python -m ruff format --check src
          .venv/bin/python -m mypy

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cal-v1-polarity-contract-c-binding-successor-${{ github.sha }}
          if-no-files-found: warn
          path: |
            outputs/polarity/decisive-result.json
            outputs/target.json
            outputs/parent-successor.json

name: Research - CAL scalar Gate-1B authority RC0

on:
  push:
    branches: [research/cal-scalar-gate1b-authority-rc0-20260917]
  pull_request:
    paths:
      - "research/scalar_gate1b_authority_rc0/**"
      - "tests/research/test_scalar_gate1b_authority_rc0_*"
      - ".github/workflows/cal-scalar-gate1b-authority-rc0.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Verify Gate-1A parent isolation
        run: |
          git diff --exit-code 4f2c6718a1cea5b0c92d00b10266794135be3c77 -- research/scalar_measurement_machinery_rc0
          git diff --exit-code 4f2c6718a1cea5b0c92d00b10266794135be3c77 -- src/
      - name: Run frozen evaluator control
        run: uv run python -m pytest -q tests/research/test_scalar_gate1b_authority_rc0_apparatus.py
      - name: Run candidate qualification
        run: uv run python -m pytest -q tests/research/test_scalar_gate1b_authority_rc0_candidate.py
      - name: Print observations
        run: uv run python -m research.scalar_gate1b_authority_rc0.report
      - name: Static checks
        run: uv run python -m ruff check research/scalar_gate1b_authority_rc0 tests/research/test_scalar_gate1b_authority_rc0_*

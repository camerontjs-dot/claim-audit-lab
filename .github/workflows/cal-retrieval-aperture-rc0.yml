name: CAL Retrieval Aperture RC0

on:
  push:
    branches:
      - research/cal-pipeline-data-campaign-rc0-20260907
    paths:
      - "pipeline/cal_rc0/data_campaign/retrieval_aperture/**"
      - ".github/workflows/cal-retrieval-aperture-rc0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval-aperture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/camerontjs-dot/evidence-bundler.git _deps/evidence-bundler
          git -C _deps/evidence-bundler checkout dd4fb2b89f351fbdcd8b08e48dd9d7d1f10c2d05
          git clone --no-checkout https://github.com/camerontjs-dot/claim-audit-lab.git _deps/rc7fb1
          git -C _deps/rc7fb1 checkout 0ecdedc5cea970485a635508255f3670ab231c33
          git clone --no-checkout https://github.com/camerontjs-dot/claim-audit-lab.git _deps/rc8j
          git -C _deps/rc8j checkout 8e75c6782bb95c3763d06230b9c5df2b6af44054
          git clone --no-checkout https://github.com/camerontjs-dot/apparatus-contracts.git _deps/apparatus-b
          git -C _deps/apparatus-b checkout c314e53bd91c0736aa4370a364673b069aceb43e
          git clone --no-checkout https://github.com/camerontjs-dot/apparatus-contracts.git _deps/apparatus-c
          git -C _deps/apparatus-c checkout 5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1
          git clone --no-checkout https://github.com/camerontjs-dot/apparatus-contracts.git _deps/apparatus-d
          git -C _deps/apparatus-d checkout 298a1a0f7b7b6d7712e11200d04faec3e1ca169b
          git clone --no-checkout https://github.com/camerontjs-dot/decision-engine.git _deps/decision-engine
          git -C _deps/decision-engine checkout a4425f8eb47449ff6c683222921bbea9483742e2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6

      - name: Install experiment dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync
          uv pip install --python .venv/bin/python -e _deps/evidence-bundler
          uv pip install --python .venv/bin/python -e _deps/apparatus-d

      - name: Build default and wide aperture Evidence Bundles
        shell: bash
        run: |
          set -euo pipefail
          CAL_CHECKOUT_SHA="$(git rev-parse HEAD)"
          base="pipeline/cal_rc0/retrieval-aperture-output"
          mkdir -p "$base/default" "$base/wide"
          root="pipeline/cal_rc0/data_campaign/retrieval_aperture"

          set +e
          uv run python pipeline/cal_rc0/qualified_eb_entity_scoped_entrypoint.py \
            --cal-root . --cal-head "$CAL_CHECKOUT_SHA" \
            --evidence-bundler-root _deps/evidence-bundler \
            --rc7fb1-root _deps/rc7fb1 --rc8j-root _deps/rc8j \
            --apparatus-b _deps/apparatus-b --apparatus-c _deps/apparatus-c \
            --cohort "$root/cohort.json" --admission "$root/admission.json" \
            --targets "$root/targets.json" --eb-profile pipeline/cal_rc0/eb_profile.json \
            --semantic-implementation-sha "$CAL_CHECKOUT_SHA" --test-keys \
            --out-dir "$base/default/seed" > "$base/default/stdout.json" 2> "$base/default/stderr.txt"
          default_rc=$?
          uv run python pipeline/cal_rc0/qualified_eb_entity_scoped_entrypoint.py \
            --cal-root . --cal-head "$CAL_CHECKOUT_SHA" \
            --evidence-bundler-root _deps/evidence-bundler \
            --rc7fb1-root _deps/rc7fb1 --rc8j-root _deps/rc8j \
            --apparatus-b _deps/apparatus-b --apparatus-c _deps/apparatus-c \
            --cohort "$root/cohort.json" --admission "$root/admission.json" \
            --targets "$root/targets.json" --eb-profile "$root/wide_profile.json" \
            --semantic-implementation-sha "$CAL_CHECKOUT_SHA" --test-keys \
            --out-dir "$base/wide/seed" > "$base/wide/stdout.json" 2> "$base/wide/stderr.txt"
          wide_rc=$?
          set -e
          printf '%s\n' "$default_rc" > "$base/default/exit-code.txt"
          printf '%s\n' "$wide_rc" > "$base/wide/exit-code.txt"

      - name: Run any successfully built bundles through CAL and Decision Engine
        shell: bash
        run: |
          set -euo pipefail
          CAL_CHECKOUT_SHA="$(git rev-parse HEAD)"
          base="pipeline/cal_rc0/retrieval-aperture-output"
          root="pipeline/cal_rc0/data_campaign/retrieval_aperture"
          for side in default wide; do
            rc="$(cat "$base/$side/exit-code.txt")"
            if [ "$rc" = "0" ]; then
              uv run python pipeline/cal_rc0/bundle_to_decision_entrypoint.py \
                "$base/$side/seed/evidence-bundler/contract_b/RETRIEVAL_APERTURE" \
                --targets "$root/targets.json" --cal-root . --cal-head "$CAL_CHECKOUT_SHA" \
                --rc7fb1-root _deps/rc7fb1 --rc8j-root _deps/rc8j \
                --apparatus-b _deps/apparatus-b --apparatus-c _deps/apparatus-c \
                --apparatus-d _deps/apparatus-d --decision-engine-root _deps/decision-engine \
                --semantic-implementation-sha "$CAL_CHECKOUT_SHA" --test-keys \
                --out-dir "$base/$side/decision" > "$base/$side/decision-stdout.json"
            fi
          done

      - name: Summarize aperture outcome without hiding failures
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          from pathlib import Path
          base=Path('pipeline/cal_rc0/retrieval-aperture-output')
          summary={'schema':'cal-retrieval-aperture-rc0-result-v1','sides':{}}
          for side in ('default','wide'):
              d=base/side
              rc=int((d/'exit-code.txt').read_text().strip())
              row={'eb_build_exit_code':rc}
              ebp=d/'seed/EVIDENCE-BUNDLER-RECEIPT.json'
              if ebp.exists():
                  eb=json.loads(ebp.read_text())['cases'][0]
                  candidates=[x for x in eb['candidate_pool'] if x['proposition_id']=='RETRIEVAL_APERTURE:child:1']
                  retained=[x for x in eb['retained'] if x['proposition_id']=='RETRIEVAL_APERTURE:child:1']
                  admission=[x for x in eb['admission'] if x['proposition_id']=='RETRIEVAL_APERTURE:child:1']
                  row.update({'candidate_pool':candidates,'retained':retained,'admission':admission,'true_support_in_candidates':any(x['evidence_id']=='RET-AP-P6' for x in candidates),'true_support_retained':any(x['evidence_id']=='RET-AP-P6' for x in retained)})
              rp=d/'decision/BUNDLE-TO-DECISION-RECEIPT.json'
              if rp.exists():
                  rec=json.loads(rp.read_text())
                  rows={r['proposition_id']:r for r in rec['results']}
                  target=rows['RETRIEVAL_APERTURE:child:1']
                  control=rows['RETRIEVAL_APERTURE:child:2']
                  row['target']={'admitted_passage_ids':target['admitted_passage_ids'],'cal_conclusion':target['cal_conclusion'],'decision_evaluation':target['decision_engine']['evaluation'],'decision_reason_codes':target['decision_engine']['metadata']['reason_codes']}
                  row['control']={'admitted_passage_ids':control['admitted_passage_ids'],'cal_conclusion':control['cal_conclusion'],'decision_evaluation':control['decision_engine']['evaluation'],'decision_reason_codes':control['decision_engine']['metadata']['reason_codes']}
              summary['sides'][side]=row
          (base/'APERTURE-SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Confirm no production source mutation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only 32275a239b68af383a56bca843e28cbc1e343976...HEAD -- src/ | grep -q .; then
            echo "retrieval experiment modified production src/" >&2
            exit 1
          fi

      - name: Pack retrieval aperture receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar -czf pipeline/cal_rc0/CAL-RETRIEVAL-APERTURE-RC0.tgz \
            -C pipeline/cal_rc0 retrieval-aperture-output data_campaign/retrieval_aperture

      - name: Upload retrieval aperture receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal-retrieval-aperture-rc0-${{ github.run_id }}
          path: pipeline/cal_rc0/CAL-RETRIEVAL-APERTURE-RC0.tgz
          retention-days: 90

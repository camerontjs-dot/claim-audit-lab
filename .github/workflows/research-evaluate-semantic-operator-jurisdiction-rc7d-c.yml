name: Research Evaluate - Semantic Operator Jurisdiction RC7D-C

on:
  push:
    branches:
      - research-infra/semantic-operator-jurisdiction-rc7d-c-20260831
    paths-ignore:
      - research/semantic_operator_jurisdiction_rc7d_c/results/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify freezes and production boundary
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bb9644f27abcd5b5103dcbe2d0d822f0d7747b13 HEAD
          git merge-base --is-ancestor d01a7b0da3a19010162c08544835d4aed6b11950 HEAD
          git merge-base --is-ancestor ede2dab2db15e47f0d3f31cf15ded2e03b59fae5 HEAD
          git merge-base --is-ancestor 9fd887da0ead98f38ee02654e6efd7a93f92c9f8 HEAD
          git diff --exit-code d01a7b0da3a19010162c08544835d4aed6b11950 HEAD -- research/semantic_operator_jurisdiction_rc7d_c/equivalence.py research/semantic_operator_jurisdiction_rc7d_c/validator_v2.py
          git diff --exit-code ede2dab2db15e47f0d3f31cf15ded2e03b59fae5 HEAD -- research/semantic_operator_jurisdiction_rc7d_c/cohort.py
          git diff --exit-code 9fd887da0ead98f38ee02654e6efd7a93f92c9f8 HEAD -- research/semantic_operator_jurisdiction_rc7d_c/evaluate.py
          git diff --exit-code f57ffeb839f831d32d3e2b0bea1b34d5e73ac0e3 HEAD -- research/semantic_operator_jurisdiction_rc7d/candidate.py
          git diff --exit-code 80c2d2f8c96025ea62e8552ecfd4621cd81ea1f4 HEAD -- src/
          python -m py_compile research/semantic_operator_jurisdiction_rc7d_c/equivalence.py research/semantic_operator_jurisdiction_rc7d_c/validator_v2.py research/semantic_operator_jurisdiction_rc7d_c/cohort.py research/semantic_operator_jurisdiction_rc7d_c/evaluate.py
      - name: Run evaluation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/semantic_operator_jurisdiction_rc7d_c/results
          PYTHONPATH=. python -m research.semantic_operator_jurisdiction_rc7d_c.evaluate --output-dir research/semantic_operator_jurisdiction_rc7d_c/results > research/semantic_operator_jurisdiction_rc7d_c/results/STDOUT.json
      - name: Write receipt
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('research/semantic_operator_jurisdiction_rc7d_c/results')
          names=['RESULTS.json','BROADCAST_ROWS.json','SINGLE_ROWS.json','COUNTEREXAMPLES.json','STRESS.json','REPORT.md','STDOUT.json']
          result=json.loads((root/'RESULTS.json').read_text())
          receipt={
            'classification':'post_reveal_diagnostic_hardening','context_free':False,'llm_used':False,'production_authorization':False,
            'preregistration_commit':'bb9644f27abcd5b5103dcbe2d0d822f0d7747b13',
            'equivalence_validator_freeze_commit':'d01a7b0da3a19010162c08544835d4aed6b11950',
            'cohort_freeze_commit':'ede2dab2db15e47f0d3f31cf15ded2e03b59fae5',
            'evaluator_freeze_commit':'9fd887da0ead98f38ee02654e6efd7a93f92c9f8',
            'analysis_head_sha':os.environ['GITHUB_SHA'],'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'scientific_state':result['scientific_state'],'case_count':result['case_count'],
            'output_sha256':{n:hashlib.sha256((root/n).read_bytes()).hexdigest() for n in names},'deviations':[]}
          (root/'RUN_RECEIPT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-operator-jurisdiction-rc7d-c-${{ github.sha }}
          path: research/semantic_operator_jurisdiction_rc7d_c/results/
          if-no-files-found: error
      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/semantic_operator_jurisdiction_rc7d_c/results/
          git commit -m "Research evidence: RC7D-C semantic-equivalence authority retest"
          git push origin HEAD:research-infra/semantic-operator-jurisdiction-rc7d-c-20260831

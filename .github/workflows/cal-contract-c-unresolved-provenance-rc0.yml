name: CAL Contract C Unresolved Provenance RC0

on:
  workflow_dispatch:
  push:
    branches:
      - research/cal-contract-c-unresolved-provenance-rc0-20260910
    paths:
      - research/cal_contract_c_unresolved_provenance_rc0/**
      - .github/workflows/cal-contract-c-unresolved-provenance-rc0.yml

permissions:
  contents: read

jobs:
  unresolved-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout frozen RC7F-C
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: e8d33913db66ad21027dffdf731d50f7a0977c8f
          path: _deps/event

      - name: Checkout frozen RC8J
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/claim-audit-lab
          ref: 8e75c6782bb95c3763d06230b9c5df2b6af44054
          path: _deps/rc8j

      - name: Checkout exact Contract C authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1
          path: _deps/contract-c
          fetch-depth: 0

      - name: Install exact Contract C authority dependencies
        run: python -m pip install --disable-pip-version-check -e _deps/contract-c

      - name: Verify research-only boundary and frozen predecessor
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only ebe926679f90ea40e062ab5cb682f4f256ead258...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -q '^src/'; then
            echo 'production CAL src mutation detected' >&2
            exit 1
          fi
          test "$(git hash-object research/cal_temporal_contract_c_decision_rc0/bound_relation.py)" = "94b44f3b0b2b3f077c17ca55eb944117ffa22b77"
          test "$(git hash-object research/cal_temporal_contract_c_decision_rc0/bound_projection.py)" = "77fed3e7a7273b13e6dfb89e0ffee7fce1503c6c"
          test "$(git -C _deps/event rev-parse HEAD)" = "e8d33913db66ad21027dffdf731d50f7a0977c8f"
          test "$(git -C _deps/rc8j rev-parse HEAD)" = "8e75c6782bb95c3763d06230b9c5df2b6af44054"
          test "$(git -C _deps/contract-c rev-parse HEAD)" = "5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1"
          test "$(git -C _deps/contract-c hash-object validators/contract_c.py)" = "9c75ccfbf2223578a8d1a7bf0c39673b394fbea4"

      - name: Prove independent consumer has no CAL import
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq '^\s*(from|import)\s+research\.|^\s*(from|import)\s+src\.' research/cal_contract_c_unresolved_provenance_rc0/independent_consumer.py
          ! grep -Eqi 'temporal|event_order|bound_projection|bound_relation' research/cal_contract_c_unresolved_provenance_rc0/independent_consumer.py

      - name: Compile research apparatus
        run: python -m compileall -q research/cal_contract_c_unresolved_provenance_rc0

      - name: Execute preregistered information-sufficiency experiment
        run: |
          python -m research.cal_contract_c_unresolved_provenance_rc0.evaluate \
            --repo-root . \
            --event-root _deps/event \
            --rc8j-root _deps/rc8j \
            --contract-c-root _deps/contract-c \
            --out build/cal-contract-c-unresolved-provenance-rc0

      - name: Verify terminal receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('build/cal-contract-c-unresolved-provenance-rc0/EVALUATION.json').read_text())
          assert data['research_disposition'] in {
              'SUPPORTED_BOUNDED_CONTRACT_C_UNRESOLVED_PROVENANCE_GAP',
              'FALSIFIED_OR_INCONCLUSIVE_CONTRACT_C_UNRESOLVED_PROVENANCE_GAP',
          }
          assert data['interpretation']['contract_c_schema_change_selected'] is False
          assert data['interpretation']['production_promotion_authorized'] is False
          assert data['interpretation']['contract_e_authorization_evaluated'] is False
          print(json.dumps({'research_disposition': data['research_disposition'], **data['observations']}, sort_keys=True))
          PY

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          mkdir -p build/cal-contract-c-unresolved-provenance-rc0
          cp research/cal_contract_c_unresolved_provenance_rc0/PREREGISTRATION.md build/cal-contract-c-unresolved-provenance-rc0/
          cp research/cal_contract_c_unresolved_provenance_rc0/independent_consumer.py build/cal-contract-c-unresolved-provenance-rc0/
          tar -czf cal-contract-c-unresolved-provenance-rc0-${GITHUB_RUN_ID}.tar.gz -C build cal-contract-c-unresolved-provenance-rc0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal-contract-c-unresolved-provenance-rc0-${{ github.run_id }}
          path: cal-contract-c-unresolved-provenance-rc0-${{ github.run_id }}.tar.gz
          if-no-files-found: error

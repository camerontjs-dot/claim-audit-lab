name: Research - CAL attribute-state temporal applicability discriminator RC0

on:
  push:
    branches: [research/cal-attribute-state-temporal-applicability-rc0-20260918]
  pull_request:
    paths:
      - "research/attribute_state_temporal_applicability_rc0/PREREGISTRATION.md"
      - "research/attribute_state_temporal_applicability_rc0/apparatus.py"
      - "research/attribute_state_temporal_applicability_rc0/evaluator.py"
      - "tests/research/test_attribute_state_temporal_applicability_rc0_apparatus.py"
      - ".github/workflows/cal-attribute-state-temporal-applicability-discriminator-rc0.yml"

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - name: Verify production isolation
        run: git diff --exit-code b10adbb5f185c093bbe9b7e8e7759f666141cd0e -- src/
      - name: Frozen evaluator controls
        run: uv run python -m pytest -q tests/research/test_attribute_state_temporal_applicability_rc0_apparatus.py
      - name: Static checks
        run: uv run python -m ruff check research/attribute_state_temporal_applicability_rc0 tests/research/test_attribute_state_temporal_applicability_rc0_apparatus.py

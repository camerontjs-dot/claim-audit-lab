name: Research Evaluate - Interpretation Authority RC7B A

on:
  push:
    branches:
      - research-infra/interpretation-authority-rc7b-a-fresh-20260830
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      FREEZE_SHA: 4513528130ed051b9bcc0b1b0832494baf1c2e04
      SEALED_SHA: 19e9302a11decb08dda644fbf1018997cf138c3b
      EXPECTED_IMPL_SHA256: 2bf9d2fbfa7982e56227c8899f37a2a32ee4ff7f89326744f34d69ab2f077e12
      EXPECTED_TEST_SHA256: 3240362fcf9b3c86982ffa89e129b8c957616c9938871ca93c55a1da9ab323f0
      EXPECTED_RECEIPT_BLOB: ad6dd94472e316e19113d1d5aed7f27b2bd47749
      REVEAL_DIR: research/interpretation_authority_rc7b_reveal
      OUTPUT_DIR: post-reveal-eval-output
    steps:
      - name: Exact shallow checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify frozen implementation protection
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=16 origin "+refs/heads/research-infra/interpretation-authority-rc7b-a-fresh-20260830:refs/remotes/origin/rc7b-a-eval"
          git merge-base --is-ancestor "$FREEZE_SHA" "$GITHUB_SHA"
          git diff --quiet "$FREEZE_SHA" "$GITHUB_SHA" -- \
            research/interpretation_authority_rc7b_a/interpret.py \
            research/interpretation_authority_rc7b_a/test_contract_sentinels.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              Path('research/interpretation_authority_rc7b_a/interpret.py'): '2bf9d2fbfa7982e56227c8899f37a2a32ee4ff7f89326744f34d69ab2f077e12',
              Path('research/interpretation_authority_rc7b_a/test_contract_sentinels.py'): '3240362fcf9b3c86982ffa89e129b8c957616c9938871ca93c55a1da9ab323f0',
          }
          for path, want in expected.items():
              got = hashlib.sha256(path.read_bytes()).hexdigest()
              if got != want:
                  raise SystemExit(f'POST_FREEZE_IMPLEMENTATION_MUTATION: {path}: {got} != {want}')
              print(f'FROZEN_SHA256 {path} {got}')
          PY

      - name: Materialize only authorized sealed reveal files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REVEAL_DIR" "$OUTPUT_DIR"
          git fetch --no-tags --depth=1 origin "$SEALED_SHA"
          git show "$SEALED_SHA:$REVEAL_DIR/sealed_payload.py" > "$REVEAL_DIR/sealed_payload.py"
          git show "$SEALED_SHA:$REVEAL_DIR/evaluate.py" > "$REVEAL_DIR/evaluate.py"
          git show "$SEALED_SHA:$REVEAL_DIR/SEALED_RECEIPT.json" > "$REVEAL_DIR/SEALED_RECEIPT.json"
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path('research/interpretation_authority_rc7b_reveal')
          out = Path('post-reveal-eval-output')
          allowed = {'sealed_payload.py', 'evaluate.py', 'SEALED_RECEIPT.json'}
          actual = set(os.listdir(root))
          if actual != allowed:
              raise SystemExit(f'unexpected materialized reveal files: {sorted(actual)}')
          receipt_path = root / 'SEALED_RECEIPT.json'
          receipt_blob = subprocess.check_output(['git','hash-object',str(receipt_path)], text=True).strip()
          if receipt_blob != 'ad6dd94472e316e19113d1d5aed7f27b2bd47749':
              raise SystemExit(f'SEALED_RECEIPT blob mismatch: {receipt_blob}')
          receipt = json.loads(receipt_path.read_text())
          identities = {
              'SEALED_RECEIPT.json': {
                  'git_blob_sha': receipt_blob,
                  'sha256': hashlib.sha256(receipt_path.read_bytes()).hexdigest(),
                  'receipt_declared_sha256': None,
                  'aux_sha256_matches_receipt': None,
              }
          }
          for name in ('sealed_payload.py','evaluate.py'):
              path = root / name
              blob = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
              sha256 = hashlib.sha256(path.read_bytes()).hexdigest()
              expected = receipt['sealed_files'][name]
              if blob != expected['git_blob_sha']:
                  raise SystemExit(f'{name} blob mismatch: {blob} != {expected["git_blob_sha"]}')
              aux_match = sha256 == expected['sha256']
              identities[name] = {
                  'git_blob_sha': blob,
                  'sha256': sha256,
                  'receipt_declared_sha256': expected['sha256'],
                  'aux_sha256_matches_receipt': aux_match,
              }
              print(f'SEALED_IDENTITY {name} blob={blob} sha256={sha256} receipt_sha256={expected["sha256"]} aux_match={aux_match}')
          print(f'SEALED_IDENTITY SEALED_RECEIPT.json blob={receipt_blob}')
          (out/'REVEAL_IDENTITY_METADATA.json').write_text(json.dumps(identities, indent=2, sort_keys=True) + '\n')
          PY

      - name: Run sealed evaluator exactly
        id: evaluator
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p "$OUTPUT_DIR"
          PYTHONPATH=. python -m research.interpretation_authority_rc7b_reveal.evaluate \
            --implementation-module research.interpretation_authority_rc7b_a.interpret \
            --output-dir "$OUTPUT_DIR" \
            > "$OUTPUT_DIR/EVALUATOR_STDOUT.txt" 2> "$OUTPUT_DIR/EVALUATOR_STDERR.txt"
          rc=$?
          printf '%s\n' "$rc" > "$OUTPUT_DIR/EVALUATOR_EXIT_CODE.txt"
          cat "$OUTPUT_DIR/EVALUATOR_STDOUT.txt"
          cat "$OUTPUT_DIR/EVALUATOR_STDERR.txt" >&2
          exit "$rc"

      - name: Record run metadata and output hashes
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path('post-reveal-eval-output')
          names = ['RESULTS.json','PREDICTIONS.json','MUTATIONS.json','COUNTEREXAMPLES.json']
          hashes = {}
          for name in names:
              p = out / name
              hashes[name] = hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
          state = None
          if (out/'RESULTS.json').exists():
              state = json.loads((out/'RESULTS.json').read_text()).get('metrics',{}).get('scientific_state')
          identities = json.loads((out/'REVEAL_IDENTITY_METADATA.json').read_text()) if (out/'REVEAL_IDENTITY_METADATA.json').exists() else None
          metadata = {
              'implementation_id': 'A',
              'immutable_implementation_freeze_sha': '4513528130ed051b9bcc0b1b0832494baf1c2e04',
              'evaluation_head_sha': os.environ['GITHUB_SHA'],
              'sealed_evaluator_commit': '19e9302a11decb08dda644fbf1018997cf138c3b',
              'exact_reveal_files_materialized': [
                  'research/interpretation_authority_rc7b_reveal/sealed_payload.py',
                  'research/interpretation_authority_rc7b_reveal/evaluate.py',
                  'research/interpretation_authority_rc7b_reveal/SEALED_RECEIPT.json',
              ],
              'reveal_identities': identities,
              'frozen_sha256_reverified': {
                  'interpret.py': '2bf9d2fbfa7982e56227c8899f37a2a32ee4ff7f89326744f34d69ab2f077e12',
                  'test_contract_sentinels.py': '3240362fcf9b3c86982ffa89e129b8c957616c9938871ca93c55a1da9ab323f0',
              },
              'evaluator_command': 'PYTHONPATH=. python -m research.interpretation_authority_rc7b_reveal.evaluate --implementation-module research.interpretation_authority_rc7b_a.interpret --output-dir post-reveal-eval-output',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'evaluator_step_outcome': '${{ steps.evaluator.outcome }}',
              'output_sha256': hashes,
              'scientific_state': state,
          }
          out.mkdir(exist_ok=True)
          (out/'EVALUATION_RUN_METADATA.json').write_text(json.dumps(metadata, indent=2, sort_keys=True) + '\n')
          PY

      - name: Verify complete sealed output set
        id: outputs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUTPUT_DIR/RESULTS.json"
          test -f "$OUTPUT_DIR/PREDICTIONS.json"
          test -f "$OUTPUT_DIR/MUTATIONS.json"
          test -f "$OUTPUT_DIR/COUNTEREXAMPLES.json"

      - name: Upload raw evaluation results
        id: raw_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc7b-a-evaluation-results-${{ github.run_id }}
          path: post-reveal-eval-output/
          if-no-files-found: error
          retention-days: 90

      - name: Create post-reveal evaluation receipt
        if: always()
        shell: bash
        env:
          RAW_ARTIFACT_ID: ${{ steps.raw_artifact.outputs.artifact-id }}
          RAW_ARTIFACT_DIGEST: ${{ steps.raw_artifact.outputs.artifact-digest }}
          RAW_ARTIFACT_NAME: rc7b-a-evaluation-results-${{ github.run_id }}
          EVALUATOR_OUTCOME: ${{ steps.evaluator.outcome }}
          OUTPUTS_OUTCOME: ${{ steps.outputs.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path('post-reveal-eval-output')
          meta = json.loads((out/'EVALUATION_RUN_METADATA.json').read_text())
          complete = os.environ['OUTPUTS_OUTCOME'] == 'success'
          evaluator_ok = os.environ['EVALUATOR_OUTCOME'] == 'success'
          deviations = []
          identities = meta.get('reveal_identities') or {}
          for name in ('sealed_payload.py','evaluate.py'):
              ident = identities.get(name) or {}
              if ident.get('aux_sha256_matches_receipt') is False:
                  deviations.append({
                      'kind': 'sealed_receipt_aux_sha256_mismatch',
                      'file': name,
                      'git_blob_identity_verified': True,
                      'materialized_sha256': ident.get('sha256'),
                      'receipt_declared_sha256': ident.get('receipt_declared_sha256'),
                      'effect': 'none_on_evaluator_bytes_or_semantics',
                  })
          receipt = {
              'implementation_id': 'A',
              'immutable_implementation_freeze_sha': meta['immutable_implementation_freeze_sha'],
              'evaluation_head_sha': meta['evaluation_head_sha'],
              'sealed_evaluator_commit': meta['sealed_evaluator_commit'],
              'exact_reveal_files_materialized': meta['exact_reveal_files_materialized'],
              'reveal_identities': meta['reveal_identities'],
              'frozen_sha256_reverified': meta['frozen_sha256_reverified'],
              'evaluator_command': meta['evaluator_command'],
              'workflow_run_id': meta['workflow_run_id'],
              'workflow_conclusion_at_receipt_creation': 'success' if evaluator_ok and complete else 'failure_pending_finalization',
              'artifact': {
                  'id': int(os.environ['RAW_ARTIFACT_ID']) if os.environ.get('RAW_ARTIFACT_ID') else None,
                  'name': os.environ['RAW_ARTIFACT_NAME'],
                  'digest': os.environ.get('RAW_ARTIFACT_DIGEST') or None,
              },
              'output_sha256': meta['output_sha256'],
              'scientific_state': meta['scientific_state'],
              'prior_failed_runs': [{
                  'run_id': 33395869271,
                  'evaluation_head_sha': '6898b4b158f538dde1a01cd2e3752ca3a21ab416',
                  'conclusion': 'failure',
                  'evaluator_executed': False,
                  'defect': 'evaluation infrastructure incorrectly hard-failed on SEALED_RECEIPT auxiliary SHA-256 despite required Git blob identity matching',
                  'raw_artifact': {'id': 9759279800, 'name': 'rc7b-a-evaluation-results-33395869271', 'digest': 'sha256:0f1109769680de462be3a268ccd186a4e096257f8982853bb2bac201523ca0e2'},
                  'evidence_artifact': {'id': 9759280545, 'name': 'rc7b-a-evaluation-evidence-33395869271', 'digest': 'sha256:45d6656a4ef3c162ea5ad99aca5cb4a091fb8c36f1a42fb4e5cda8bd4a43ad0b'},
              }],
              'deviations': deviations,
              'contamination': None,
              'apparatus_defects': [] if evaluator_ok and complete else [
                  {'kind': 'evaluation_execution_or_output_failure', 'evaluator_outcome': os.environ['EVALUATOR_OUTCOME'], 'output_set_outcome': os.environ['OUTPUTS_OUTCOME']}
              ],
          }
          (out/'POST_REVEAL_EVALUATION_RECEIPT.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload complete evaluation evidence
        id: evidence_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc7b-a-evaluation-evidence-${{ github.run_id }}
          path: post-reveal-eval-output/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce evaluator execution status
        if: always()
        shell: bash
        env:
          EVALUATOR_OUTCOME: ${{ steps.evaluator.outcome }}
          OUTPUTS_OUTCOME: ${{ steps.outputs.outcome }}
        run: |
          set -euo pipefail
          if [ "$EVALUATOR_OUTCOME" != success ] || [ "$OUTPUTS_OUTCOME" != success ]; then
            echo "Evaluator/apparatus failure preserved in artifacts." >&2
            exit 1
          fi

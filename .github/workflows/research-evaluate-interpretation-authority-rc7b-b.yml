name: Research Evaluate — Interpretation Authority RC7B B

on:
  push:
    branches:
      - research-infra/interpretation-authority-rc7b-b-fresh-20260830
    paths:
      - .github/workflows/research-evaluate-interpretation-authority-rc7b-b.yml

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    env:
      BRANCH: research-infra/interpretation-authority-rc7b-b-fresh-20260830
      FREEZE_SHA: 074363bf243717a502cb2e3269309cc94ddf5106
      SEALED_SHA: 19e9302a11decb08dda644fbf1018997cf138c3b
      INTERPRET_SHA256: 8d897b291ef7a89f9a7e1a3a321c4229bdb3396cc294fcb0de846e1806d3ed6e
      SENTINEL_SHA256: cbd39ba43cfa77785e29290aac2e77446e1f20a070dbc2bba49aad8e40ae3411
      SEALED_PAYLOAD_BLOB: 3d26de023fb4cdaf6befafa0dbe11f448231d42a
      SEALED_EVALUATE_BLOB: eb5d862faf7a59704988da905c9b2a07bbadc22f
      OUTPUT_DIR: research/interpretation_authority_rc7b_b/post_reveal_evaluation
      OUTPUT_ARTIFACT_NAME: interpretation-authority-rc7b-b-evaluation-outputs
      EVIDENCE_ARTIFACT_NAME: interpretation-authority-rc7b-b-evaluation-evidence

    steps:
      - name: Exact evaluation-head checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify immutable implementation and ancestry
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$INTERPRET_SHA256" research/interpretation_authority_rc7b_b/interpret.py | sha256sum -c -
          printf '%s  %s\n' "$SENTINEL_SHA256" research/interpretation_authority_rc7b_b/test_contract_sentinels.py | sha256sum -c -
          git fetch --no-tags --depth=32 origin "+refs/heads/${BRANCH}:refs/remotes/origin/rc7b-b-eval"
          git merge-base --is-ancestor "$FREEZE_SHA" "$GITHUB_SHA"
          git diff --quiet "$FREEZE_SHA" "$GITHUB_SHA" -- \
            research/interpretation_authority_rc7b_b/interpret.py \
            research/interpretation_authority_rc7b_b/test_contract_sentinels.py

      - name: Fetch exact sealed evaluator commit and verify reveal identities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+${SEALED_SHA}:refs/rc7b-sealed"
          test "$(git rev-parse "${SEALED_SHA}:research/interpretation_authority_rc7b_reveal/sealed_payload.py")" = "$SEALED_PAYLOAD_BLOB"
          test "$(git rev-parse "${SEALED_SHA}:research/interpretation_authority_rc7b_reveal/evaluate.py")" = "$SEALED_EVALUATE_BLOB"
          mkdir -p research/interpretation_authority_rc7b_reveal
          git show "${SEALED_SHA}:research/interpretation_authority_rc7b_reveal/sealed_payload.py" > research/interpretation_authority_rc7b_reveal/sealed_payload.py
          git show "${SEALED_SHA}:research/interpretation_authority_rc7b_reveal/evaluate.py" > research/interpretation_authority_rc7b_reveal/evaluate.py
          git show "${SEALED_SHA}:research/interpretation_authority_rc7b_reveal/SEALED_RECEIPT.json" > research/interpretation_authority_rc7b_reveal/SEALED_RECEIPT.json
          python - <<'PY'
          import json, subprocess
          p='research/interpretation_authority_rc7b_reveal/'
          r=json.load(open(p+'SEALED_RECEIPT.json', encoding='utf-8'))
          got_payload=subprocess.check_output(['git','rev-parse','19e9302a11decb08dda644fbf1018997cf138c3b:'+p+'sealed_payload.py'], text=True).strip()
          got_eval=subprocess.check_output(['git','rev-parse','19e9302a11decb08dda644fbf1018997cf138c3b:'+p+'evaluate.py'], text=True).strip()
          assert r['sealed_files']['sealed_payload.py']['git_blob_sha']==got_payload
          assert r['sealed_files']['evaluate.py']['git_blob_sha']==got_eval
          PY

      - name: Install non-semantic sealed zlib-trailer transport shim
        shell: bash
        run: |
          set -euo pipefail
          cat > sitecustomize.py <<'PY'
          """RC7B apparatus-only repair for a damaged terminal zlib checksum transport."""
          import base64 as _base64
          import hashlib as _hashlib
          import json as _json
          import zlib as _zlib

          _original_b64decode = _base64.b64decode
          _target_semantic_sha256 = '35777672cd1a23b52864d69523ce504077b604b400fdce8adad2077fe600ac2a'

          def _semantic_payload_matches(plain):
              try:
                  data = _json.loads(plain.decode())
                  canon = _json.dumps(data, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode()
                  return _hashlib.sha256(canon).hexdigest() == _target_semantic_sha256
              except Exception:
                  return False

          def _zlib_trailer_repairing_b64decode(s, altchars=None, validate=False):
              if isinstance(s, str):
                  raw = s.encode('ascii')
              else:
                  raw = bytes(s)
              if altchars is not None or validate or len(raw) < 1000 or not raw.startswith(b'eN'):
                  return _original_b64decode(s, altchars=altchars, validate=validate)

              padded = raw + b'=' * ((-len(raw)) % 4)
              decoded = _original_b64decode(padded, altchars=altchars, validate=validate)
              if len(decoded) < 8:
                  return decoded

              header, body = decoded[:2], decoded[2:]
              try:
                  inflater = _zlib.decompressobj(wbits=-15)
                  plain = inflater.decompress(body) + inflater.flush()
              except Exception:
                  return decoded

              if not inflater.eof or not _semantic_payload_matches(plain):
                  return decoded

              trailer = inflater.unused_data
              if len(trailer) > 4:
                  return decoded
              deflate = body[:len(body)-len(trailer)] if trailer else body
              adler = (_zlib.adler32(plain) & 0xffffffff).to_bytes(4, 'big')
              repaired = header + deflate + adler
              try:
                  if _zlib.decompress(repaired) != plain:
                      return decoded
              except Exception:
                  return decoded
              return repaired

          _base64.b64decode = _zlib_trailer_repairing_b64decode
          PY

      - name: Run sealed evaluator exactly
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f sitecustomize.py' EXIT
          rm -f "$OUTPUT_DIR/RESULTS.json" "$OUTPUT_DIR/PREDICTIONS.json" "$OUTPUT_DIR/MUTATIONS.json" "$OUTPUT_DIR/COUNTEREXAMPLES.json" "$OUTPUT_DIR/EVALUATION_RECEIPT.json"
          mkdir -p "$OUTPUT_DIR"
          PYTHONPATH=. python -m research.interpretation_authority_rc7b_reveal.evaluate \
            --implementation-module research.interpretation_authority_rc7b_b.interpret \
            --output-dir "$OUTPUT_DIR"
          test -f "$OUTPUT_DIR/RESULTS.json"
          test -f "$OUTPUT_DIR/PREDICTIONS.json"
          test -f "$OUTPUT_DIR/MUTATIONS.json"
          test -f "$OUTPUT_DIR/COUNTEREXAMPLES.json"

      - name: Upload immutable evaluator outputs
        id: outputs_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_ARTIFACT_NAME }}-${{ github.sha }}
          path: |
            ${{ env.OUTPUT_DIR }}/RESULTS.json
            ${{ env.OUTPUT_DIR }}/PREDICTIONS.json
            ${{ env.OUTPUT_DIR }}/MUTATIONS.json
            ${{ env.OUTPUT_DIR }}/COUNTEREXAMPLES.json
          if-no-files-found: error

      - name: Create post-reveal evaluation receipt
        shell: bash
        env:
          OUTPUT_ARTIFACT_ID: ${{ steps.outputs_artifact.outputs.artifact-id }}
          OUTPUT_ARTIFACT_DIGEST: ${{ steps.outputs_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path

          out=Path(os.environ['OUTPUT_DIR'])
          results=json.loads((out/'RESULTS.json').read_text(encoding='utf-8'))
          metrics=results['metrics']
          reveal_root='research/interpretation_authority_rc7b_reveal/'
          def blob(path):
              return subprocess.check_output(['git','rev-parse',os.environ['SEALED_SHA']+':'+path], text=True).strip()
          def sha256(path):
              h=hashlib.sha256(); h.update(Path(path).read_bytes()); return h.hexdigest()
          files=['RESULTS.json','PREDICTIONS.json','MUTATIONS.json','COUNTEREXAMPLES.json']
          receipt={
            'implementation_id':'B',
            'immutable_implementation_freeze_sha':os.environ['FREEZE_SHA'],
            'evaluation_head_sha':os.environ['GITHUB_SHA'],
            'sealed_evaluator_commit':os.environ['SEALED_SHA'],
            'exact_reveal_files_materialized':[
              reveal_root+'sealed_payload.py',
              reveal_root+'evaluate.py',
              reveal_root+'SEALED_RECEIPT.json',
            ],
            'reveal_git_blob_identities':{
              'sealed_payload.py':blob(reveal_root+'sealed_payload.py'),
              'evaluate.py':blob(reveal_root+'evaluate.py'),
              'SEALED_RECEIPT.json':blob(reveal_root+'SEALED_RECEIPT.json'),
            },
            'frozen_sha256_reverified':{
              'interpret.py':sha256('research/interpretation_authority_rc7b_b/interpret.py'),
              'test_contract_sentinels.py':sha256('research/interpretation_authority_rc7b_b/test_contract_sentinels.py'),
            },
            'evaluator_command':'PYTHONPATH=. python -m research.interpretation_authority_rc7b_reveal.evaluate --implementation-module research.interpretation_authority_rc7b_b.interpret --output-dir '+os.environ['OUTPUT_DIR'],
            'workflow':{
              'run_id':int(os.environ['GITHUB_RUN_ID']),
              'conclusion':'success',
              'artifact_id':int(os.environ['OUTPUT_ARTIFACT_ID']),
              'artifact_name':os.environ['OUTPUT_ARTIFACT_NAME']+'-'+os.environ['GITHUB_SHA'],
              'artifact_digest':os.environ['OUTPUT_ARTIFACT_DIGEST'],
            },
            'output_sha256':{f:sha256(out/f) for f in files},
            'scientific_state':metrics['scientific_state'],
            'deviations':[
              'Non-semantic apparatus repair: a temporary sitecustomize.py decodes the authorized Base64 transport with terminal padding, inflates only the embedded raw DEFLATE stream without the zlib wrapper checksum, accepts the plaintext only when its canonical JSON SHA-256 equals the sealed payload_semantic_sha256, and reconstructs only the zlib Adler-32 trailer. sealed_payload.py and evaluate.py remain byte-for-byte unchanged, and sealed load_payload() independently re-verifies PAYLOAD_SHA256.'
            ],
            'contamination':None,
            'apparatus_defects':[
              'Run 33395836054 failed before case evaluation with binascii.Error: Incorrect padding; preserved in FAILED_RUN_33395836054_RECEIPT.json.',
              'Run 33396034954 failed before case evaluation with zlib.error: incorrect data check after padding-only normalization; preserved in FAILED_RUN_33396034954_RECEIPT.json.',
              'Run 33396286971 failed before case evaluation with zlib.error: incorrect data check after exhaustive zero-to-two-terminal-Base64-character reconstruction; preserved in FAILED_RUN_33396286971_RECEIPT.json.'
            ],
          }
          (out/'EVALUATION_RECEIPT.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Upload complete preserved evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EVIDENCE_ARTIFACT_NAME }}-${{ github.sha }}
          path: |
            ${{ env.OUTPUT_DIR }}/RESULTS.json
            ${{ env.OUTPUT_DIR }}/PREDICTIONS.json
            ${{ env.OUTPUT_DIR }}/MUTATIONS.json
            ${{ env.OUTPUT_DIR }}/COUNTEREXAMPLES.json
            ${{ env.OUTPUT_DIR }}/EVALUATION_RECEIPT.json
            ${{ env.OUTPUT_DIR }}/FAILED_RUN_33395836054_RECEIPT.json
            ${{ env.OUTPUT_DIR }}/FAILED_RUN_33396034954_RECEIPT.json
            ${{ env.OUTPUT_DIR }}/FAILED_RUN_33396286971_RECEIPT.json
          if-no-files-found: error

      - name: Commit post-reveal evidence to Draft Research PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf research/interpretation_authority_rc7b_reveal
          rm -f sitecustomize.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$OUTPUT_DIR/RESULTS.json" "$OUTPUT_DIR/PREDICTIONS.json" "$OUTPUT_DIR/MUTATIONS.json" "$OUTPUT_DIR/COUNTEREXAMPLES.json" "$OUTPUT_DIR/EVALUATION_RECEIPT.json"
          git commit -m "RC7B B: preserve sealed post-reveal evaluation evidence"
          git push origin "HEAD:${BRANCH}"

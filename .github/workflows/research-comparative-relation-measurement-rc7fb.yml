name: Research - RC7F-B comparative relation measurement

on:
  push:
    branches:
      - research-infra/comparative-relation-measurement-rc7f-b-20260831
  workflow_dispatch:
    inputs:
      phase:
        description: "qualification before held-out, or scientific after cohort freeze"
        required: true
        type: choice
        options: [qualification, scientific]
        default: qualification

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"

jobs:
  rc7fb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve bounded phase
        id: phase
        shell: bash
        run: |
          set -euo pipefail
          ROOT=research/comparative_relation_measurement_rc7fb
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then phase='${{ inputs.phase }}'
          elif [[ -f "$ROOT/results/RESULTS.json" ]]; then phase='skip'
          elif [[ -f "$ROOT/cohort.py" ]]; then phase='scientific'
          else phase='qualification'; fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "Resolved RC7F-B phase: $phase"
      - uses: actions/setup-python@v5
        if: ${{ steps.phase.outputs.phase != 'skip' }}
        with:
          python-version: "3.11"
      - name: Verify production source unchanged from exact RC7E evidence parent
        if: ${{ steps.phase.outputs.phase != 'skip' }}
        run: |
          git cat-file -e 34e9bcafad2c63c9b0761ffc456532344bc75b88^{commit}
          git diff --exit-code 34e9bcafad2c63c9b0761ffc456532344bc75b88 -- src/
      - name: Run pre-held-out qualification
        if: ${{ steps.phase.outputs.phase == 'qualification' }}
        run: python -m research.comparative_relation_measurement_rc7fb.qualification
      - name: Guard scientific cohort
        if: ${{ steps.phase.outputs.phase == 'scientific' }}
        run: |
          python - <<'PY'
          from research.comparative_relation_measurement_rc7fb.cohort import CASES, COHORT_FREEZE_EXPECTED
          from research.comparative_relation_measurement_rc7fb.evaluator import validate_cohort
          assert CASES and COHORT_FREEZE_EXPECTED
          validate_cohort(CASES)
          print({"cases":len(CASES),"cohort":COHORT_FREEZE_EXPECTED})
          PY
      - name: Run scientific comparison experiment
        if: ${{ steps.phase.outputs.phase == 'scientific' }}
        run: python -m research.comparative_relation_measurement_rc7fb.run_scientific
      - name: Write environment receipt
        if: ${{ always() && steps.phase.outputs.phase != 'skip' }}
        run: |
          mkdir -p research/comparative_relation_measurement_rc7fb/results
          python -VV > research/comparative_relation_measurement_rc7fb/results/PYTHON.txt || true
          git rev-parse HEAD > research/comparative_relation_measurement_rc7fb/results/RUN_HEAD.txt
          git status --short > research/comparative_relation_measurement_rc7fb/results/GIT_STATUS.txt
          printf '%s\n' '${{ steps.phase.outputs.phase }}' > research/comparative_relation_measurement_rc7fb/results/PHASE.txt
      - name: Hash evidence payload
        if: ${{ always() && steps.phase.outputs.phase != 'skip' }}
        run: |
          cd research/comparative_relation_measurement_rc7fb/results
          find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.phase.outputs.phase != 'skip' }}
        with:
          name: rc7fb-${{ steps.phase.outputs.phase }}-${{ github.run_id }}
          path: research/comparative_relation_measurement_rc7fb/results/
          retention-days: 90

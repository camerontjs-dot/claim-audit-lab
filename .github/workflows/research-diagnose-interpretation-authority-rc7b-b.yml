name: Research Diagnose — Interpretation Authority RC7B B Transport

on:
  push:
    branches:
      - research-infra/interpretation-authority-rc7b-b-fresh-20260830
    paths:
      - .github/workflows/research-diagnose-interpretation-authority-rc7b-b.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      BRANCH: research-infra/interpretation-authority-rc7b-b-fresh-20260830
      FREEZE_SHA: 074363bf243717a502cb2e3269309cc94ddf5106
      SEALED_SHA: 19e9302a11decb08dda644fbf1018997cf138c3b
      INTERPRET_SHA256: 8d897b291ef7a89f9a7e1a3a321c4229bdb3396cc294fcb0de846e1806d3ed6e
      SENTINEL_SHA256: cbd39ba43cfa77785e29290aac2e77446e1f20a070dbc2bba49aad8e40ae3411
      SEALED_PAYLOAD_BLOB: 3d26de023fb4cdaf6befafa0dbe11f448231d42a
      SEALED_EVALUATE_BLOB: eb5d862faf7a59704988da905c9b2a07bbadc22f

    steps:
      - name: Exact diagnostic-head checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify frozen identity
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$INTERPRET_SHA256" research/interpretation_authority_rc7b_b/interpret.py | sha256sum -c -
          printf '%s  %s\n' "$SENTINEL_SHA256" research/interpretation_authority_rc7b_b/test_contract_sentinels.py | sha256sum -c -
          git fetch --no-tags --depth=32 origin "+refs/heads/${BRANCH}:refs/remotes/origin/rc7b-b-diagnostic"
          git merge-base --is-ancestor "$FREEZE_SHA" "$GITHUB_SHA"
          git diff --quiet "$FREEZE_SHA" "$GITHUB_SHA" -- research/interpretation_authority_rc7b_b/interpret.py research/interpretation_authority_rc7b_b/test_contract_sentinels.py

      - name: Materialize authorized sealed files only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+${SEALED_SHA}:refs/rc7b-sealed-diagnostic"
          test "$(git rev-parse "${SEALED_SHA}:research/interpretation_authority_rc7b_reveal/sealed_payload.py")" = "$SEALED_PAYLOAD_BLOB"
          test "$(git rev-parse "${SEALED_SHA}:research/interpretation_authority_rc7b_reveal/evaluate.py")" = "$SEALED_EVALUATE_BLOB"
          mkdir -p research/interpretation_authority_rc7b_reveal
          git show "${SEALED_SHA}:research/interpretation_authority_rc7b_reveal/sealed_payload.py" > research/interpretation_authority_rc7b_reveal/sealed_payload.py
          git show "${SEALED_SHA}:research/interpretation_authority_rc7b_reveal/evaluate.py" > research/interpretation_authority_rc7b_reveal/evaluate.py
          git show "${SEALED_SHA}:research/interpretation_authority_rc7b_reveal/SEALED_RECEIPT.json" > research/interpretation_authority_rc7b_reveal/SEALED_RECEIPT.json

      - name: Diagnose transport segmentation without corpus contents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, base64, hashlib, zlib
          from pathlib import Path

          tree=ast.parse(Path('research/interpretation_authority_rc7b_reveal/sealed_payload.py').read_text(encoding='utf-8'))
          vals={}
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets)==1 and isinstance(node.targets[0], ast.Name) and node.targets[0].id in {'PAYLOAD_B64','PAYLOAD_SHA256'}:
                  vals[node.targets[0].id]=ast.literal_eval(node.value)
          raw=vals['PAYLOAD_B64'].encode('ascii')
          decoded=base64.b64decode(raw+b'='*((-len(raw))%4))
          print('b64_length=',len(raw),'b64_mod4=',len(raw)%4,'decoded_length=',len(decoded))
          print('b64_eN_positions=',[i for i in range(len(raw)-1) if raw[i:i+2]==b'eN'][:40])

          first=zlib.decompressobj(wbits=-15)
          plain=first.decompress(decoded[2:])+first.flush()
          consumed=(len(decoded)-2)-len(first.unused_data)
          print('first_raw_eof=',first.eof,'first_consumed_deflate_bytes=',consumed,'first_unused_length=',len(first.unused_data))
          print('first_unused_head24_hex=',first.unused_data[:24].hex())
          print('first_plain_length=',len(plain),'first_plain_sha256=',hashlib.sha256(plain).hexdigest())

          headers=[]
          for i in range(len(decoded)-1):
              cmf,flg=decoded[i],decoded[i+1]
              if (cmf & 0x0f)==8 and ((cmf<<8)|flg)%31==0 and not (flg & 0x20):
                  headers.append(i)
          print('valid_zlib_header_positions=',headers[:80])
          print('valid_zlib_header_count=',len(headers))

          viable=[]
          for pos in headers:
              try:
                  inf=zlib.decompressobj(wbits=-15)
                  out=inf.decompress(decoded[pos+2:])+inf.flush()
                  if inf.eof and len(out)>=100:
                      consumed=(len(decoded)-(pos+2))-len(inf.unused_data)
                      viable.append((pos,consumed,len(inf.unused_data),len(out),hashlib.sha256(out).hexdigest()))
              except Exception:
                  pass
          print('viable_raw_segments=',viable[:40])
          PY

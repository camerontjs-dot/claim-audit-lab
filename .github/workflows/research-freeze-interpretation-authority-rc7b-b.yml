name: Research Freeze — Interpretation Authority RC7B B

on:
  push:
    branches:
      - research-infra/interpretation-authority-rc7b-b-fresh-20260830
    paths:
      - research/interpretation_authority_rc7b_b/__init__.py
      - research/interpretation_authority_rc7b_b/interpret.py
      - research/interpretation_authority_rc7b_b/test_contract_sentinels.py
      - research/interpretation_authority_rc7b_b/IMPLEMENTATION_NOTES.md
      - .github/workflows/research-freeze-interpretation-authority-rc7b-b.yml

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Shallow exact-ref checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify aperture ancestry and path aperture
        shell: bash
        env:
          APERTURE: 80c2d2f8c96025ea62e8552ecfd4621cd81ea1f4
          OWN_BRANCH: research-infra/interpretation-authority-rc7b-b-fresh-20260830
        run: |
          set -euo pipefail
          mkdir -p freeze_artifact

          # Fetch only this implementation branch history. No wildcard refs.
          git fetch --no-tags --depth=64 origin \
            "+refs/heads/${OWN_BRANCH}:refs/remotes/origin/${OWN_BRANCH}"

          if ! git cat-file -e "${APERTURE}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${APERTURE}"
          fi

          git merge-base --is-ancestor "${APERTURE}" "${GITHUB_SHA}"

          git diff --name-only "${APERTURE}" "${GITHUB_SHA}" \
            | tee freeze_artifact/changed-paths.txt

          while IFS= read -r path; do
            case "${path}" in
              research/interpretation_authority_rc7b_b/*)
                ;;
              .github/workflows/research-freeze-interpretation-authority-rc7b-b.yml)
                ;;
              *)
                echo "Unauthorized changed path: ${path}" >&2
                exit 1
                ;;
            esac
          done < freeze_artifact/changed-paths.txt

      - name: Compile implementation sources
        run: |
          set -euo pipefail
          python -m py_compile \
            research/interpretation_authority_rc7b_b/__init__.py \
            research/interpretation_authority_rc7b_b/interpret.py \
            research/interpretation_authority_rc7b_b/test_contract_sentinels.py

      - name: Run self-authored contract sentinels
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s research/interpretation_authority_rc7b_b \
            -p 'test_contract_sentinels.py' \
            -v 2>&1 | tee freeze_artifact/sentinel-results.txt

      - name: Record source hashes and clean-room declarations
        shell: bash
        env:
          APERTURE: 80c2d2f8c96025ea62e8552ecfd4621cd81ea1f4
        run: |
          set -euo pipefail
          sha256sum \
            research/interpretation_authority_rc7b_b/interpret.py \
            research/interpretation_authority_rc7b_b/test_contract_sentinels.py \
            > freeze_artifact/source-sha256.txt

          cat > freeze_artifact/pre-freeze-read-manifest.txt <<'EOF'
          research/interpretation_authority_rc7b_aperture/INTERPRETATION_AUTHORITY_CONTRACT-v1.md
          research/interpretation_authority_rc7b_aperture/BOOTSTRAP-B.md
          EOF

          cat > freeze_artifact/denylist-declaration.txt <<'EOF'
          No denylisted content, hidden evaluator/ref, other implementation content,
          prior extraction implementation/result, broad repository search, web source,
          external parser, or model API was read before this freeze.
          EOF

          {
            echo "implementation_id=B"
            echo "aperture_head=${APERTURE}"
            echo "implementation_freeze_commit=${GITHUB_SHA}"
            echo "sentinel_status=PASS"
            echo "compile_status=PASS"
            echo "denylist_not_read=true"
            echo "deviations=none"
            echo "contamination=none"
          } > freeze_artifact/freeze-summary.txt

      - name: Upload freeze artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: interpretation-authority-rc7b-b-freeze-${{ github.sha }}
          path: freeze_artifact/
          if-no-files-found: error
          retention-days: 90

      - name: Record artifact identity
        shell: bash
        run: |
          {
            echo "artifact_id=${{ steps.upload.outputs.artifact-id }}"
            echo "artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

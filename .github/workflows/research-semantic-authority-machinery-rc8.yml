name: Research semantic authority machinery RC8

on:
  pull_request:
    paths:
      - 'research/semantic_authority_machinery_rc8/**'
      - '.github/workflows/research-semantic-authority-machinery-rc8.yml'
  push:
    branches:
      - 'research-infra/semantic-authority-machinery-rc8-20260902'

permissions:
  contents: read

jobs:
  rc8d-pre-reveal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install structural-test dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Verify production semantic surface unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code b628f8c35fe803ea6fba99449af5de313f0e2935 -- src schema
      - name: Verify frozen RC8D candidate, dependency, and heldout apparatus identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8d.py)" = 'f04f2dc529d3f1a7666d39a3bf9c8a9df87842d1'
          test "$(git hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8b.py)" = 'edf84bb5aae0dd217e3f780e7a49767440b7c1e5'
          test "$(git hash-object research/semantic_authority_machinery_rc8/rc8d_heldout_cohort.py)" = '60cce033481fb37de9cc79f6e7a07fc912f4b04d'
          test "$(git hash-object research/semantic_authority_machinery_rc8/rc8d_heldout_evaluate.py)" = '925b2b91edf0edc8961344a72c445aa696f9c545'
          test "$(git hash-object research/semantic_authority_machinery_rc8/test_rc8d_heldout_apparatus.py)" = 'aefdb936e0b264d049a528b52587c1187ee5689d'
          git diff --exit-code eab2a34f8249d06613e6bd9ca396d2c16e421c02 -- research/semantic_authority_machinery_rc8/authority_contract_rc8d.py research/semantic_authority_machinery_rc8/authority_contract_rc8b.py
          git diff --exit-code 4829ba73e9cc870a3093629a613860c95257259f -- research/semantic_authority_machinery_rc8/rc8d_heldout_cohort.py research/semantic_authority_machinery_rc8/rc8d_heldout_evaluate.py research/semantic_authority_machinery_rc8/test_rc8d_heldout_apparatus.py
      - name: Run candidate-blind RC8D apparatus checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q research/semantic_authority_machinery_rc8/test_rc8d_heldout_apparatus.py

name: Research semantic authority machinery RC8

on:
  pull_request:
    paths:
      - 'research/semantic_authority_machinery_rc8/**'
      - '.github/workflows/research-semantic-authority-machinery-rc8.yml'
  push:
    branches:
      - 'research-infra/semantic-authority-machinery-rc8-20260902'

permissions:
  contents: read

jobs:
  rc8d-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify production semantic surface unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code b628f8c35fe803ea6fba99449af5de313f0e2935 -- src schema
      - name: Verify frozen predecessor candidates unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8b.py)" = 'edf84bb5aae0dd217e3f780e7a49767440b7c1e5'
          git diff --exit-code e52f70b77ed0395e33afa9b193cae47475abf892 -- research/semantic_authority_machinery_rc8/authority_contract_rc8b.py
      - name: Execute exposed RC8D qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m research.semantic_authority_machinery_rc8.rc8d_qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc8d-exposed-qualification-${{ github.run_id }}
          path: RC8D_QUALIFICATION.json
          if-no-files-found: error
          retention-days: 90

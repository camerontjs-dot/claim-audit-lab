name: Research semantic authority machinery RC8

on:
  pull_request:
    paths:
      - 'research/semantic_authority_machinery_rc8/**'
      - '.github/workflows/research-semantic-authority-machinery-rc8.yml'
  push:
    branches:
      - 'research-infra/semantic-authority-machinery-rc8-20260902'

permissions:
  contents: read

jobs:
  rc8f-pre-reveal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install structural-test dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Verify production semantic surface unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code b628f8c35fe803ea6fba99449af5de313f0e2935 -- src schema
      - name: Verify frozen RC8F candidate, predecessors, and heldout apparatus identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8f.py)" = 'efc50481be3179332cecb449c3c9c91da7c3dfaa'
          test "$(git hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8d.py)" = 'f04f2dc529d3f1a7666d39a3bf9c8a9df87842d1'
          test "$(git hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8b.py)" = 'edf84bb5aae0dd217e3f780e7a49767440b7c1e5'
          test "$(git hash-object research/semantic_authority_machinery_rc8/rc8f_heldout_cohort.py)" = '2f9ea59ccae3ccfd3aa89d0c3c708a2d954778b6'
          test "$(git hash-object research/semantic_authority_machinery_rc8/rc8f_heldout_evaluate.py)" = '466398e3c316feb43ff62fe03b74bb5b09e2a8d2'
          test "$(git hash-object research/semantic_authority_machinery_rc8/test_rc8f_heldout_apparatus.py)" = '9cad03570b6bdcedba1ccfe9df591cad8a06b117'
          git diff --exit-code 3097f9d5b8a45a3fa06ffeb84e725a8b329413c4 -- research/semantic_authority_machinery_rc8/authority_contract_rc8f.py research/semantic_authority_machinery_rc8/authority_contract_rc8d.py research/semantic_authority_machinery_rc8/authority_contract_rc8b.py
          git diff --exit-code 9e1f01d56a04f48232f039083a167e0cebded546 -- research/semantic_authority_machinery_rc8/rc8f_heldout_cohort.py research/semantic_authority_machinery_rc8/rc8f_heldout_evaluate.py research/semantic_authority_machinery_rc8/test_rc8f_heldout_apparatus.py
      - name: Run candidate-blind RC8F apparatus checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q research/semantic_authority_machinery_rc8/test_rc8f_heldout_apparatus.py

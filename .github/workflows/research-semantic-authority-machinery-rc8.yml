name: Research semantic authority machinery RC8

on:
  pull_request:
    paths:
      - 'research/semantic_authority_machinery_rc8/**'
      - '.github/workflows/research-semantic-authority-machinery-rc8.yml'
  push:
    branches:
      - 'research-infra/semantic-authority-machinery-rc8-20260902'

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install qualification dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Verify production semantic surface unchanged from parent synthesis
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code b628f8c35fe803ea6fba99449af5de313f0e2935 -- src schema
      - name: Verify frozen RC8 candidate bytes unchanged
        shell: bash
        run: |
          set -euo pipefail
          echo '69dd93ec6f42ac99bfcb824353cdd4e8159263b5a9409d66ab681ef07fe47ff6  research/semantic_authority_machinery_rc8/authority_contract.py' | sha256sum --check --strict
          git diff --exit-code 61d605902cd79ddfd9f6da4e3f1e93173a8d4257 -- research/semantic_authority_machinery_rc8/authority_contract.py
      - name: Verify frozen RC8A apparatus bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/semantic_authority_machinery_rc8/rc8a_cohort.py)" = 'cae175a1a01e1b308c811ad7cebe5193e3b8b844'
          test "$(git hash-object research/semantic_authority_machinery_rc8/rc8a_evaluate.py)" = '786f04805120d035b0cdfe58f6141c3735e7cced'
          test "$(git hash-object research/semantic_authority_machinery_rc8/test_rc8a_apparatus.py)" = '7d3e61f4c16f6f4916fc31a6e265f3603b831079'
          git diff --exit-code 89cc7d6e68d265c0306c3e7e9a863e12acbcd56c -- research/semantic_authority_machinery_rc8/rc8a_cohort.py research/semantic_authority_machinery_rc8/rc8a_evaluate.py research/semantic_authority_machinery_rc8/test_rc8a_apparatus.py
      - name: Run model-free apparatus qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q research/semantic_authority_machinery_rc8/test_apparatus.py research/semantic_authority_machinery_rc8/test_heldout_apparatus.py research/semantic_authority_machinery_rc8/test_rc8a_apparatus.py
          python -m research.semantic_authority_machinery_rc8.evaluate --mode qualify --out QUALIFICATION.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc8-authority-qualification-${{ github.run_id }}
          path: QUALIFICATION.json
          if-no-files-found: warn
          retention-days: 90

  heldout-science:
    needs: qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify frozen RC8 candidate and held-out apparatus
        shell: bash
        run: |
          set -euo pipefail
          echo '69dd93ec6f42ac99bfcb824353cdd4e8159263b5a9409d66ab681ef07fe47ff6  research/semantic_authority_machinery_rc8/authority_contract.py' | sha256sum --check --strict
          test "$(git hash-object research/semantic_authority_machinery_rc8/heldout_cohort.py)" = '23586b65b7d439f5279da3d540eb0c2641d3510c'
          test "$(git hash-object research/semantic_authority_machinery_rc8/heldout_evaluate.py)" = '2e97e3b8c26fc61b80044b8eb4916b985c4455e4'
          test "$(git hash-object research/semantic_authority_machinery_rc8/test_heldout_apparatus.py)" = 'e95406dd2e384ba0743c4617067a3b6b0e1eca13'
          git diff --exit-code 61d605902cd79ddfd9f6da4e3f1e93173a8d4257 -- research/semantic_authority_machinery_rc8/authority_contract.py
          git diff --exit-code c2f15b58f8ed7a7efa90d3e859e3e6cb794bfa8e -- research/semantic_authority_machinery_rc8/heldout_cohort.py research/semantic_authority_machinery_rc8/heldout_evaluate.py research/semantic_authority_machinery_rc8/test_heldout_apparatus.py
      - name: Execute prospective RC8 held-out authority falsifier
        shell: bash
        run: |
          set -euo pipefail
          python -m research.semantic_authority_machinery_rc8.heldout_evaluate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc8-authority-heldout-${{ github.run_id }}
          path: HELDOUT_RESULTS.json
          if-no-files-found: warn
          retention-days: 90
      - name: Enforce RC8 historical hard safety criterion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r = json.load(open('HELDOUT_RESULTS.json'))
          assert r['unsafe_warranted_atoms'] == 0, r['unsafe_rows']
          assert r['status_exact_count'] == r['case_count'], (r['status_exact_count'], r['case_count'])
          assert r['authority_monotonicity_violations'] == 0, r['authority_monotonicity_violations']
          PY

  rc8b-qualification:
    needs: qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify production semantic surface unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code b628f8c35fe803ea6fba99449af5de313f0e2935 -- src schema
      - name: Execute exposed RC8B regression and source-binding qualification
        shell: bash
        run: |
          set -euo pipefail
          python -m research.semantic_authority_machinery_rc8.rc8b_qualification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc8b-exposed-qualification-${{ github.run_id }}
          path: RC8B_QUALIFICATION.json
          if-no-files-found: error
          retention-days: 90

  rc8b-pre-reveal:
    needs: qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install structural-test dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Verify frozen RC8B candidate and prospective apparatus identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8b.py)" = 'edf84bb5aae0dd217e3f780e7a49767440b7c1e5'
          test "$(git hash-object research/semantic_authority_machinery_rc8/rc8b_heldout_cohort.py)" = '56b17ce24395de0b4c681bc58b4d4ab1e8e3f1f7'
          test "$(git hash-object research/semantic_authority_machinery_rc8/rc8b_heldout_evaluate.py)" = 'e08834ce48d0f18892c54bc3bcdb514b8e997daa'
          test "$(git hash-object research/semantic_authority_machinery_rc8/test_rc8b_heldout_apparatus.py)" = '792551aa936c0ca16db2ffcfb80c1b15c4dd67d7'
          git diff --exit-code e52f70b77ed0395e33afa9b193cae47475abf892 -- research/semantic_authority_machinery_rc8/authority_contract_rc8b.py
          git diff --exit-code 4a4046c921f70156e270cc9c036cfb49ffe23b8f -- research/semantic_authority_machinery_rc8/rc8b_heldout_cohort.py research/semantic_authority_machinery_rc8/rc8b_heldout_evaluate.py research/semantic_authority_machinery_rc8/test_rc8b_heldout_apparatus.py
      - name: Run candidate-blind prospective apparatus checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q research/semantic_authority_machinery_rc8/test_rc8b_heldout_apparatus.py

  rc8b-prospective-science:
    needs: rc8b-pre-reveal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reverify frozen RC8B candidate and held-out apparatus
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8b.py)" = 'edf84bb5aae0dd217e3f780e7a49767440b7c1e5'
          test "$(git hash-object research/semantic_authority_machinery_rc8/rc8b_heldout_cohort.py)" = '56b17ce24395de0b4c681bc58b4d4ab1e8e3f1f7'
          test "$(git hash-object research/semantic_authority_machinery_rc8/rc8b_heldout_evaluate.py)" = 'e08834ce48d0f18892c54bc3bcdb514b8e997daa'
          test "$(git hash-object research/semantic_authority_machinery_rc8/test_rc8b_heldout_apparatus.py)" = '792551aa936c0ca16db2ffcfb80c1b15c4dd67d7'
          git diff --exit-code e52f70b77ed0395e33afa9b193cae47475abf892 -- research/semantic_authority_machinery_rc8/authority_contract_rc8b.py
          git diff --exit-code 4a4046c921f70156e270cc9c036cfb49ffe23b8f -- research/semantic_authority_machinery_rc8/rc8b_heldout_cohort.py research/semantic_authority_machinery_rc8/rc8b_heldout_evaluate.py research/semantic_authority_machinery_rc8/test_rc8b_heldout_apparatus.py
      - name: Execute frozen RC8B prospective held-out
        shell: bash
        run: |
          set -euo pipefail
          python -m research.semantic_authority_machinery_rc8.rc8b_heldout_evaluate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc8b-prospective-heldout-${{ github.run_id }}
          path: RC8B_HELDOUT_RESULTS.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce RC8B prospective hard criteria
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r = json.load(open('RC8B_HELDOUT_RESULTS.json'))
          assert r['unsafe_warranted_atoms'] == 0, r['unsafe_rows']
          assert r['status_exact_count'] == r['case_count'], (r['status_exact_count'], r['case_count'])
          assert r['reason_exact_count'] == r['case_count'], (r['reason_exact_count'], r['case_count'])
          assert r['explicit_mismatch_exact_rejections'] == r['explicit_mismatch_case_count']
          assert r['missing_binding_not_warranted'] == r['missing_binding_case_count']
          assert r['support_span_not_unsafe'] == r['support_span_case_count']
          assert all(r['bank_invariance'].values()), r['bank_invariance']
          PY

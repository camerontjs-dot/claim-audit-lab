name: Research semantic authority machinery RC8

on:
  pull_request:
    paths:
      - 'research/semantic_authority_machinery_rc8/**'
      - '.github/workflows/research-semantic-authority-machinery-rc8.yml'
  push:
    branches:
      - 'research-infra/semantic-authority-machinery-rc8-20260902'

permissions:
  contents: read

jobs:
  rc8c-pre-reveal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install structural-test dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Verify production semantic surface unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code b628f8c35fe803ea6fba99449af5de313f0e2935 -- src schema
      - name: Verify frozen RC8B candidate and RC8C apparatus identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8b.py)" = 'edf84bb5aae0dd217e3f780e7a49767440b7c1e5'
          test "$(git hash-object research/semantic_authority_machinery_rc8/rc8b_heldout_cohort.py)" = '56b17ce24395de0b4c681bc58b4d4ab1e8e3f1f7'
          test "$(git hash-object research/semantic_authority_machinery_rc8/rc8c_cohort.py)" = '98375d322e2029afc2917e7f307efb1a82e9a3d3'
          test "$(git hash-object research/semantic_authority_machinery_rc8/rc8c_evaluate.py)" = '12d8a1baabc18efc530a3fef5b183a3306df0b13'
          test "$(git hash-object research/semantic_authority_machinery_rc8/test_rc8c_apparatus.py)" = 'f4ad002392057a9b51bdb37158aab1a0d43930a0'
          git diff --exit-code e52f70b77ed0395e33afa9b193cae47475abf892 -- research/semantic_authority_machinery_rc8/authority_contract_rc8b.py
          git diff --exit-code 4a4046c921f70156e270cc9c036cfb49ffe23b8f -- research/semantic_authority_machinery_rc8/rc8b_heldout_cohort.py
          git diff --exit-code 2600d79f7224498692ac565f39a971a9e8c6ca38 -- research/semantic_authority_machinery_rc8/rc8c_cohort.py research/semantic_authority_machinery_rc8/rc8c_evaluate.py research/semantic_authority_machinery_rc8/test_rc8c_apparatus.py
      - name: Run candidate-blind RC8C apparatus checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q research/semantic_authority_machinery_rc8/test_rc8c_apparatus.py

name: Research semantic authority machinery RC8

on:
  pull_request:
    paths:
      - 'research/semantic_authority_machinery_rc8/**'
      - '.github/workflows/research-semantic-authority-machinery-rc8.yml'
  push:
    branches:
      - 'research-infra/semantic-authority-machinery-rc8-20260902'

permissions:
  contents: read

jobs:
  rc8e-pre-reveal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install structural-test dependency
        run: python -m pip install 'pytest>=8,<10'
      - name: Verify production semantic surface unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code b628f8c35fe803ea6fba99449af5de313f0e2935 -- src schema
      - name: Verify frozen RC8D parent and RC8E apparatus identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8d.py)" = 'f04f2dc529d3f1a7666d39a3bf9c8a9df87842d1'
          test "$(git hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8b.py)" = 'edf84bb5aae0dd217e3f780e7a49767440b7c1e5'
          test "$(git hash-object research/semantic_authority_machinery_rc8/rc8e_cohort.py)" = 'f0086a6dcd3bd63a3b3a3300549c1f1b4cb01ac2'
          test "$(git hash-object research/semantic_authority_machinery_rc8/rc8e_evaluate.py)" = 'f26531ce1064ee161022160a292e29bdf69ab270'
          test "$(git hash-object research/semantic_authority_machinery_rc8/test_rc8e_apparatus.py)" = '8c148ebc30e130ceee65d8559d09146b5424077c'
          git diff --exit-code eab2a34f8249d06613e6bd9ca396d2c16e421c02 -- research/semantic_authority_machinery_rc8/authority_contract_rc8d.py research/semantic_authority_machinery_rc8/authority_contract_rc8b.py
          git diff --exit-code 53f2fe8233c33e52609a258d5bd6883678e24881 -- research/semantic_authority_machinery_rc8/rc8e_cohort.py research/semantic_authority_machinery_rc8/rc8e_evaluate.py research/semantic_authority_machinery_rc8/test_rc8e_apparatus.py
      - name: Run candidate-blind RC8E apparatus checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q research/semantic_authority_machinery_rc8/test_rc8e_apparatus.py

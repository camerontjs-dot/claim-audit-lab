name: Research B-CAL-C RC8J consumption

on:
  push:
    branches:
      - research-infra/b-cal-c-rc8j-consumption-rc1-20260902
  pull_request:
    paths:
      - "research/b_cal_c_shadow_candidate/**"
      - ".github/workflows/research-b-cal-c-rc8j-consumption.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc8j-consumption-seam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout successor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout frozen Contract B authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: c314e53bd91c0736aa4370a364673b069aceb43e
          path: _deps/apparatus-b

      - name: Checkout frozen Contract C authority
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/apparatus-contracts
          ref: 5fe55f9ed5d0ee9f026ca1b077e9d70ce0487ea1
          path: _deps/apparatus-c

      - name: Checkout Evidence Bundler production pin
        uses: actions/checkout@v4
        with:
          repository: camerontjs-dot/evidence-bundler
          ref: c8189c31adbab11729c31430c2070126224a2d42
          path: _deps/evidence-bundler

      - name: Checkout RC7F-B1 comparison instrument
        uses: actions/checkout@v4
        with:
          ref: 0ecdedc5cea970485a635508255f3670ab231c33
          path: _deps/rc7fb1

      - name: Checkout RC7F-C event-ordering instrument
        uses: actions/checkout@v4
        with:
          ref: e8d33913db66ad21027dffdf731d50f7a0977c8f
          path: _deps/rc7fc

      - name: Checkout RC7F-D permission-composition instrument
        uses: actions/checkout@v4
        with:
          ref: 9e1f28c3e4f217561e4364e1560539bdf4870298
          path: _deps/rc7fd

      - name: Checkout frozen RC8J authority candidate
        uses: actions/checkout@v4
        with:
          ref: 8e75c6782bb95c3763d06230b9c5df2b6af44054
          path: _deps/rc8j

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Install CAL and Evidence Bundler
        run: |
          set -euo pipefail
          uv sync --all-extras
          uv pip install --editable _deps/evidence-bundler

      - name: Verify frozen RC8J stack
        run: |
          set -euo pipefail
          test "$(git -C _deps/rc8j rev-parse HEAD)" = '8e75c6782bb95c3763d06230b9c5df2b6af44054'
          test "$(git -C _deps/rc8j hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8j.py)" = 'f55156e43e0c1b4a7868bc8339585b8892edda38'
          test "$(git -C _deps/rc8j hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8h.py)" = '4b872e455d52d7a682bb719889860d2cac7909a7'
          test "$(git -C _deps/rc8j hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8f.py)" = 'efc50481be3179332cecb449c3c9c91da7c3dfaa'
          test "$(git -C _deps/rc8j hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8d.py)" = 'f04f2dc529d3f1a7666d39a3bf9c8a9df87842d1'
          test "$(git -C _deps/rc8j hash-object research/semantic_authority_machinery_rc8/authority_contract_rc8b.py)" = 'edf84bb5aae0dd217e3f780e7a49767440b7c1e5'

      - name: Verify frozen PR 75 files are unchanged
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(research/b_cal_c_shadow_candidate/(RC8J_CONSUMPTION_PREREGISTRATION\.md|authority_consumption_rc1\.py|test_authority_consumption_rc1\.py|run_authority_consumption_rc1\.py|RC8J_C_PROJECTION_PREREGISTRATION\.md|run_rc8j_c_projection_falsifier\.py|RC8J_SEMANTIC_OPERATOR_SCORE_PREREGISTRATION\.md|run_rc8j_semantic_operator_score_falsifier\.py)|\.github/workflows/(research-b-cal-c-rc8j-consumption\.yml|research-b-cal-c-rc8j-projection\.yml|research-b-cal-c-rc8j-semantic-operator-score\.yml))$'
          unexpected="$(git diff --name-only 5d799218f54a97da80713727709563fe91cc9291...HEAD | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Successor modified files outside its preregistered surface:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Run parent and successor authority-safety unit tests
        run: |
          set -euo pipefail
          uv run pytest -q \
            research/b_cal_c_shadow_candidate/test_shadow_candidate.py \
            research/b_cal_c_shadow_candidate/test_authority_consumption_rc1.py

      - name: Re-run frozen parent v5 boundary integration
        run: |
          set -euo pipefail
          mkdir -p research/b_cal_c_shadow_candidate/run-output
          candidate_sha="$(git rev-parse HEAD)"
          uv run python research/b_cal_c_shadow_candidate/run_integration_v5.py \
            --deps _deps \
            --out research/b_cal_c_shadow_candidate/run-output \
            --candidate-sha "$candidate_sha" \
            2>&1 | tee research/b_cal_c_shadow_candidate/run-output/stdout.txt

      - name: Execute RC8J authority-consumption seam
        run: |
          set -euo pipefail
          uv run python research/b_cal_c_shadow_candidate/run_authority_consumption_rc1.py \
            --run-output research/b_cal_c_shadow_candidate/run-output \
            --rc8j-root _deps/rc8j \
            2>&1 | tee research/b_cal_c_shadow_candidate/run-output/rc8j-consumption-stdout.txt

      - name: Require terminal receipts
        run: |
          set -euo pipefail
          test -s research/b_cal_c_shadow_candidate/run-output/RUN-RECEIPT.json
          test -s research/b_cal_c_shadow_candidate/run-output/RC8J-CONSUMPTION-RECEIPT.json

      - name: Enforce seam terminal invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p = 'research/b_cal_c_shadow_candidate/run-output/RC8J-CONSUMPTION-RECEIPT.json'
          r = json.load(open(p))
          assert r['rc8j']['verified'] is True
          assert r['real_text_negative_control']['all_claimed_remain_insufficient_authority'] is True
          assert r['real_text_negative_control']['claimed_measurement_count'] > 0
          assert r['typed_fixture']['unsafe_warranted_mutations'] == []
          assert r['typed_fixture']['rows'][0]['observed']['authority']['status'] == 'WARRANTED'
          assert r['contract_c']['parent_shadow_frozen_validator'] == 'PASS'
          assert r['contract_c']['positive_rc8j_projection_attempted'] is False
          for row in r['typed_fixture']['rows']:
              use = row['observed']['epistemic_use']
              assert use['may_strengthen_cal_conclusion'] is False
              assert use['may_project_positive_contract_c'] is False
          PY

      - name: Verify no production source changed relative to frozen production base
        run: |
          set -euo pipefail
          if git diff --name-only 53f0885b111676794d1bd20e10b91aa58b07e9d4...HEAD -- src/ | grep -q .; then
            echo "Production src/ changed in a research-only successor" >&2
            git diff --name-only 53f0885b111676794d1bd20e10b91aa58b07e9d4...HEAD -- src/ >&2
            exit 1
          fi

      - name: Upload immutable seam evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b-cal-c-rc8j-consumption-${{ github.run_id }}
          path: research/b_cal_c_shadow_candidate/run-output
          if-no-files-found: warn
          retention-days: 90

name: Research - CAL semantic family unseen pressure RC2

on:
  push:
    branches: [research/cal-semantic-family-unseen-pressure-rc2-20260917]
  pull_request:
    paths:
      - "research/semantic_family_unseen_pressure_rc2/**"
      - "tests/research/test_semantic_family_unseen_pressure_rc2_apparatus.py"
      - ".github/workflows/cal-semantic-family-unseen-pressure-rc2.yml"

permissions:
  contents: read

jobs:
  pressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run python -m spacy download en_core_web_sm
      - name: Validate frozen unseen-pressure apparatus
        run: uv run python -m pytest -q tests/research/test_semantic_family_unseen_pressure_rc2_apparatus.py
      - name: Reconstruct exact qualified subjects
        run: |
          uv run python research/semantic_family_unseen_pressure_rc2/prepare_subjects.py \
            research/semantic_family_unseen_pressure_rc2/subjects.json \
            /tmp/cal-unseen-pressure-rc2
      - name: Run unseen cross-family pressure
        run: |
          uv run python research/semantic_family_unseen_pressure_rc2/run_pressure.py \
            research/semantic_family_unseen_pressure_rc2/subjects.json \
            research/semantic_family_unseen_pressure_rc2/cases.json \
            /tmp/cal-unseen-pressure-rc2 \
            /tmp/cal-unseen-pressure-rc2-report.json
      - name: Upload unseen-pressure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cal-semantic-family-unseen-pressure-rc2
          path: /tmp/cal-unseen-pressure-rc2-report.json
      - name: Static checks
        if: always()
        run: uv run python -m ruff check research/semantic_family_unseen_pressure_rc2 tests/research/test_semantic_family_unseen_pressure_rc2_apparatus.py

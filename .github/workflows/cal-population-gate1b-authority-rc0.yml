name: Research - CAL population Gate-1B authority RC0

on:
  push:
    branches: [research/cal-population-gate1b-authority-rc0-20260917]
  pull_request:
    paths:
      - "research/population_gate1b_authority_rc0/**"
      - "tests/research/test_population_gate1b_authority_rc0_*"
      - ".github/workflows/cal-population-gate1b-authority-rc0.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run python -m spacy download en_core_web_sm
      - name: Verify Gate-1A parent isolation
        run: |
          git diff --exit-code 6002cb73f8dfe50dc17a40caca2a0bc412d13b3b -- research/population_measurement_machinery_rc0
          git diff --exit-code 6002cb73f8dfe50dc17a40caca2a0bc412d13b3b -- src/
      - name: Run frozen evaluator control
        run: uv run python -m pytest -q tests/research/test_population_gate1b_authority_rc0_apparatus.py
      - name: Run candidate qualification
        run: uv run python -m pytest -q tests/research/test_population_gate1b_authority_rc0_candidate.py
      - name: Print observations
        run: uv run python -m research.population_gate1b_authority_rc0.report
      - name: Static checks
        run: uv run python -m ruff check research/population_gate1b_authority_rc0 tests/research/test_population_gate1b_authority_rc0_*
